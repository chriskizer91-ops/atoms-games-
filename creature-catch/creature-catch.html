    img.onload = function () { spriteCache[id] = keyAndFit(img, 64); tintCache = {}; };

<script>/* 03-mon.js */
// One creature you own or fight: stats at a level, XP, moves, healing, evolving.
var CC = window.CC || (window.CC = {});

CC.mon = {
  make: function (id, lv) {
    var m = { id: id, lv: lv, xp: CC.mon.xpFor(lv), moves: [], status: null, sleep: 0 };
    CC.mon.movesAt(id, lv).forEach(function (mv) { m.moves.push({ id: mv, pp: CC.MOVES[mv].pp }); });
    m.hp = CC.mon.stats(m).hp;
    return m;
  },
  sp: function (m) { return CC.CREATURES[m.id]; },
  name: function (m) { return CC.CREATURES[m.id].name; },
  // HP = floor(2 x base x Lv / 100) + Lv + 10, others floor(2 x base x Lv / 100) + 5
  stats: function (m) {
    var b = CC.CREATURES[m.id].base, L = m.lv;
    var f = function (v) { return Math.floor(2 * v * L / 100) + 5; };
    return { hp: Math.floor(2 * b.hp * L / 100) + L + 10, atk: f(b.atk), def: f(b.def), spd: f(b.spd) };
  },
  maxHp: function (m) { return CC.mon.stats(m).hp; },
  xpFor: function (lv) { return lv <= 1 ? 0 : lv * lv * lv; },
  // the moves a creature at this level knows: its two newest attacks, then its newest other moves,
  // so a wild or gifted creature never ends up with only one way to do damage
  movesAt: function (id, lv) {
    var learned = CC.CREATURES[id].learn.filter(function (e) { return e[0] <= lv; }).map(function (e) { return e[1]; });
    if (learned.length <= 4) return learned;
    var hits = learned.filter(function (m) { return CC.MOVES[m].power; }).reverse();
    var others = learned.filter(function (m) { return !CC.MOVES[m].power; }).reverse();
    var keep = hits.slice(0, 2), rest = others.concat(hits.slice(2));
    rest.sort(function (a, b) { return learned.indexOf(b) - learned.indexOf(a); });
    while (keep.length < 4 && rest.length) keep.push(rest.shift());
    return learned.filter(function (m) { return keep.indexOf(m) >= 0; });
  },
  newMovesAt: function (id, lv) {
    return CC.CREATURES[id].learn.filter(function (e) { return e[0] === lv; }).map(function (e) { return e[1]; });
  },
  knows: function (m, mv) { return m.moves.some(function (x) { return x.id === mv; }); },
  heal: function (m) {
    m.hp = CC.mon.maxHp(m); m.status = null; m.sleep = 0;
    m.moves.forEach(function (x) { x.pp = CC.MOVES[x.id].pp; });
  },
  // can it evolve now? (shards are used from the bag instead)
  canEvolve: function (m) {
    var e = CC.CREATURES[m.id].evo;
    return !!(e && typeof e.at === 'number' && m.lv >= e.at);
  },
  // changes species in place, keeps the HP lost, returns the moves the new form picks up
  evolve: function (m) {
    var before = CC.mon.stats(m), into = CC.CREATURES[m.id].evo.into, oldLearn = CC.CREATURES[m.id].learn;
    m.id = into;
    var after = CC.mon.stats(m);
    m.hp = Math.max(1, m.hp + after.hp - before.hp);
    var had = {}; oldLearn.forEach(function (e) { had[e[1]] = 1; });
    return CC.CREATURES[into].learn.filter(function (e) { return e[0] <= m.lv && !had[e[1]] && !CC.mon.knows(m, e[1]); }).map(function (e) { return e[1]; });
  },
};

// The game state that gets saved
CC.newState = function () {
  return {
    map: 'village', x: 9, y: 10, dir: 'down',
    party: [], vault: [], bag: { cube: 0, potion: 0 }, coins: 300,

};
CC.markSeen = function (id) { CC.state.seen[id] = 1; };
CC.markCaught = function (id) { CC.state.seen[id] = 1; CC.state.caught[id] = 1; };
CC.healParty = function () { CC.state.party.forEach(CC.mon.heal); };
CC.firstHealthy = function () {
  var p = CC.state.party;
  for (var i = 0; i < p.length; i++) if (p[i].hp > 0) return i;

};

CC.addCreature = function (m) {
  m.status = null; m.sleep = 0;
  CC.markCaught(m.id);

<script>/* 04-ui.js */
// Shared UI screens: dialog, choices, menus, party, summary, bag, shop, vault, learning moves, evolution.
var CC = window.CC || (window.CC = {});

// ---------- dialog ----------
// CC.say('text') shows the text in the bottom box, typewriter style, and resolves when the player has read it.
CC.say = function (text, opts) {
  opts = opts || {};
  return new Promise(function (resolve) {
    var lines = CC.wrap(text, 222, 10), page = 0, shown = 0;
    var scr = {
      name: 'say',
      update: function (dt) {
        var pageText = lines.slice(page * 2, page * 2 + 2).join('\n');
        if (shown < pageText.length) {
          shown += dt * (CC.input.held.a || CC.input.held.b ? 160 : 55);
          if (CC.input.pressed.a || CC.input.pressed.b) shown = pageText.length;
          return;
        }
        if (opts.auto != null) { opts.auto -= dt; if (opts.auto > 0) return; }
        else if (!(CC.input.pressed.a || CC.input.pressed.b)) return;
        if (opts.auto == null) CC.sfx('blip');
        if ((page + 1) * 2 < lines.length) { page++; shown = 0; return; }
        CC.pop(scr); resolve();
      },
      draw: function () {
        CC.box(0, 112, 240, 48);
        var pageText = lines.slice(page * 2, page * 2 + 2).join('\n').slice(0, Math.floor(shown));
        pageText.split('\n').forEach(function (l, i) { CC.text(l, 9, 119 + i * 15, '#2a2230'); });
        if (opts.who) { var w = CC.textWidth(opts.who, 9) + 10; CC.box(4, 101, w, 14, { fill: '#f0e2c8' }); CC.text(opts.who, 9, 103, '#6a3a2a', { size: 9 }); }
        var done = Math.floor(shown) >= lines.slice(page * 2, page * 2 + 2).join('\n').length;
        if (done && opts.auto == null && Math.floor(CC.time * 3) % 2) { CC.rect(226, 149, 6, 2, '#6a3a2a'); CC.rect(228, 151, 2, 2, '#6a3a2a'); }
      },
    };
    CC.push(scr);
  });
};
// several lines in a row, each its own box
CC.talk = async function (who, lines) {
  for (var i = 0; i < lines.length; i++) await CC.say(lines[i], { who: who });
};

// ---------- menus ----------
// CC.menu(items, opts) resolves to the chosen index, or -1 on B (unless opts.noCancel).
// items: strings or { label, right, disabled }
CC.menu = function (items, opts) {
  opts = opts || {};
  return new Promise(function (resolve) {
    var sel = opts.start || 0, rowH = opts.rowH || 14;
    var labels = items.map(function (it) { return typeof it === 'string' ? { label: it } : it; });
    var w = opts.w || Math.max.apply(null, labels.map(function (l) { return CC.textWidth(l.label, 10) + (l.right ? CC.textWidth(l.right, 10) + 12 : 0); })) + 26;
    var h = labels.length * rowH + 10 + (opts.title ? 14 : 0);
    var x = opts.x != null ? opts.x : CC.W - w - 2, y = opts.y != null ? opts.y : 110 - h;
    var scr = {
      name: 'menu',
      update: function () {
        if (CC.repeat('down')) { sel = (sel + 1) % labels.length; CC.sfx('blip'); if (opts.onMove) opts.onMove(sel); }
        if (CC.repeat('up')) { sel = (sel + labels.length - 1) % labels.length; CC.sfx('blip'); if (opts.onMove) opts.onMove(sel); }
        if (CC.input.pressed.a) {
          if (labels[sel].disabled) { CC.sfx('bump'); return; }
          CC.sfx('select'); CC.pop(scr); resolve(sel);
        } else if ((CC.input.pressed.b || (opts.startCloses && CC.input.pressed.start)) && !opts.noCancel) { CC.sfx('back'); CC.pop(scr); resolve(-1); }
      },
      draw: function () {
        if (opts.under) opts.under(sel);
        CC.box(x, y, w, h);
        var ty = y + 6;
        if (opts.title) { CC.text(opts.title, x + 8, ty, '#6a3a2a', { size: 9 }); ty += 14; }
        labels.forEach(function (l, i) {
          CC.text(l.label, x + 16, ty + i * rowH, l.disabled ? '#a89c90' : '#2a2230');
          if (l.right) CC.text(l.right, x + w - 8, ty + i * rowH, '#6a5a50', { align: 'right' });
        });
        CC.cursor(x + 7, ty + sel * rowH + 2);
      },
    };
    CC.push(scr);
  });
};
CC.yesNo = async function (question, who) {
  var p = CC.say(question, { who: who });
  await p;
  return (await CC.menu(['Yes', 'No'], { y: 74 })) === 0;
};
// ask while the question stays on screen
CC.ask = function (question, options, who) {
  var lines = CC.wrap(question, 222, 10);
  var under = function () {
    CC.box(0, 112, 240, 48);
    lines.slice(0, 2).forEach(function (l, i) { CC.text(l, 9, 119 + i * 15, '#2a2230'); });
    if (who) { var w = CC.textWidth(who, 9) + 10; CC.box(4, 101, w, 14, { fill: '#f0e2c8' }); CC.text(who, 9, 103, '#6a3a2a', { size: 9 }); }
  };
  return CC.menu(options, { under: under, y: 108 - (options.length * 14 + 10) });
};

CC.typeBadge = function (type, x, y) {

var STATUS_TAG = { burn: ['BRN', '#e0582a'], freeze: ['FRZ', '#5ab0e0'], shock: ['SHK', '#d8b010'], poison: ['PSN', '#9a4ac8'], sleep: ['SLP', '#8a8aa0'] };

// ---------- party ----------
// mode 'field' (look, reorder, use items from there), 'battle' (pick who to send out), 'pick' (pick one, any)
CC.partyScreen = function (mode, opts) {
  opts = opts || {};
  return new Promise(function (resolve) {
    var sel = 0;
    var scr = {
      name: 'party', opaque: true,
      update: function () {
        var party = CC.state.party;
        if (CC.repeat('down')) { sel = (sel + 1) % party.length; CC.sfx('blip'); }
        if (CC.repeat('up')) { sel = (sel + party.length - 1) % party.length; CC.sfx('blip'); }
        if (CC.input.pressed.b && !opts.mustPick) { CC.sfx('back'); CC.pop(scr); resolve(-1); }
        if (CC.input.pressed.a) { CC.sfx('select'); scr.busy = true; scr.choose(sel).then(function (done) { scr.busy = false; if (done) { CC.pop(scr); resolve(sel); } }); }
      },
      choose: async function (i) {
        var m = CC.state.party[i];
        if (mode === 'pick') return true;
        if (mode === 'battle') {
          var c = await CC.menu(['Send out', 'Summary']);
          if (c === 1) { await CC.summary(m); return false; }
          if (c !== 0) return false;
          if (m.hp <= 0) { await CC.say(CC.mon.name(m) + ' has no strength left!'); return false; }
          if (i === opts.active) { await CC.say(CC.mon.name(m) + ' is already out!'); return false; }
          return true;
        }
        var items = ['Summary', 'Move to front'];
        var c2 = await CC.menu(items);
        if (c2 === 0) await CC.summary(m);
        if (c2 === 1 && i > 0) { CC.state.party.splice(i, 1); CC.state.party.unshift(m); sel = 0; }
        return false;
      },
      draw: function () {
        CC.rect(0, 0, 240, 160, '#5a7ab0');
        for (var yy = 0; yy < 160; yy += 8) CC.rect(0, yy, 240, 4, '#5272a8');
        CC.text(opts.title || 'Party', 8, 4, '#ffffff', { shadow: '#2a3a60' });
        CC.state.party.forEach(function (m, i) {
          var y = 18 + i * 30, on = i === sel, sp = CC.mon.sp(m), st = CC.mon.stats(m);
          CC.box(6, y, 228, 28, { fill: on ? '#fff8d0' : '#fbf3e0', edge: on ? '#e8a838' : '#c8a878' });
          CC.drawSprite(CC.creatureSprite(m.id), 24, y + 27, { scale: 0.4, sy: 1 + (on ? Math.sin(CC.time * 8) * 0.06 : 0) });
          CC.text(sp.name, 42, y + 4); CC.text('Lv ' + m.lv, 42, y + 15, '#6a5a50', { size: 9 });
          var bx = 72; sp.types.forEach(function (t) { bx += CC.typeBadge(t, bx, y + 15) + 2; });
          CC.text('HP', 140, y + 4, '#6a5a50', { size: 9 });
          CC.bar(156, y + 8, 70, m.hp / st.hp);
          CC.text(m.hp + '/' + st.hp, 226, y + 14, '#2a2230', { size: 10, align: 'right' });
          CC.statusTag(m.hp <= 0 ? null : m.status, 140, y + 16);
          if (m.hp <= 0) CC.text('FAINTED', 140, y + 15, '#c83a3a', { size: 8 });
        });

CC.summary = function (m) {
  return new Promise(function (resolve) {

      opaque: true,
      update: function () { if (CC.input.pressed.a || CC.input.pressed.b) { CC.sfx('back'); CC.pop(scr); resolve(); } },

// ---------- bag ----------
CC.ITEMS = {
  cube: { name: 'Basic Cube', price: 50, info: 'Throw it at a weakened wild creature to catch it.' },
  potion: { name: 'Potion', price: 60, info: 'Restores 30 HP to one creature.' },
};
CC.bagScreen = async function () {
  while (true) {
    var keys = Object.keys(CC.ITEMS).filter(function (k) { return CC.state.bag[k] > 0; });
    if (!keys.length) { await CC.say('Your bag is empty.'); return; }
    var c = await CC.menu(keys.map(function (k) { return { label: CC.ITEMS[k].name, right: 'x' + CC.state.bag[k] }; }), { title: 'Bag', w: 130 });
    if (c < 0) return;
    var k = keys[c];
    if (k === 'potion') {
      var i = await CC.partyScreen('pick', { title: 'Use a Potion on...' });
      if (i < 0) continue;
      var m = CC.state.party[i], max = CC.mon.maxHp(m);
      if (m.hp <= 0) { await CC.say('A Potion can\'t wake a fainted creature.'); continue; }
      if (m.hp >= max) { await CC.say(CC.mon.name(m) + ' is already at full HP.'); continue; }
      var before = m.hp; m.hp = Math.min(max, m.hp + 30); CC.state.bag.potion--;
      CC.sfx('heal'); await CC.say(CC.mon.name(m) + ' got back ' + (m.hp - before) + ' HP.');

CC.shopScreen = async function () {
  var stock = ['cube', 'potion'];
  while (true) {
    var c = await CC.menu(stock.map(function (k) { return { label: CC.ITEMS[k].name, right: CC.ITEMS[k].price + 'c' }; }),
      { title: 'Coins: ' + CC.state.coins, w: 140, x: 96, y: 8 });
    if (c < 0) return;
    var it = CC.ITEMS[stock[c]];
    var qty = await CC.menu(['1', '5', '10'].map(function (n) { return { label: 'x' + n, right: (it.price * n) + 'c', disabled: it.price * n > CC.state.coins }; }), { title: it.name, x: 140, y: 40, w: 96 });
    if (qty < 0) continue;
    var n = [1, 5, 10][qty];
    CC.state.coins -= it.price * n; CC.state.bag[stock[c]] = (CC.state.bag[stock[c]] || 0) + n;
    CC.sfx('buy'); await CC.say('Here you go! ' + n + ' x ' + it.name + '.', { who: 'Pip' });

// ---------- the Cube Vault ----------
CC.vaultScreen = async function () {
  while (true) {
    var c = await CC.menu(['Take out', 'Put away', 'Done'], { title: 'Cube Vault (' + CC.state.vault.length + ')', w: 130, x: 104, y: 20 });
    if (c < 0 || c === 2) return;
    if (c === 0) {
      if (!CC.state.vault.length) { await CC.say('The Vault is empty.'); continue; }
      var items = CC.state.vault.map(function (m) { return { label: CC.mon.name(m), right: 'Lv ' + m.lv }; });
      var v = await CC.menu(items, { title: 'Take out which?', w: 150, x: 84, y: 8 });
      if (v < 0) continue;
      var m = CC.state.vault[v];
      if (CC.state.party.length < 4) {
        CC.state.vault.splice(v, 1); CC.state.party.push(m);
        await CC.say(CC.mon.name(m) + ' joined your party.');
      } else {
        var p = await CC.partyScreen('pick', { title: 'Swap ' + CC.mon.name(m) + ' with...', hint: 'Your party is full: pick one to put away.' });
        if (p < 0) continue;
        var out = CC.state.party[p];
        CC.state.party[p] = m; CC.state.vault[v] = out;
        await CC.say(CC.mon.name(m) + ' joined, and ' + CC.mon.name(out) + ' went into the Vault.');
      }
    } else {
      if (CC.state.party.length <= 1) { await CC.say('You need at least one creature with you.'); continue; }
      var q = await CC.partyScreen('pick', { title: 'Put away which?' });
      if (q < 0) continue;
      var mm = CC.state.party.splice(q, 1)[0];
      if (CC.firstHealthy() < 0) { CC.state.party.splice(q, 0, mm); await CC.say('Keep at least one creature that can fight!'); continue; }
      CC.state.vault.push(mm);
      await CC.say(CC.mon.name(mm) + ' went into the Vault.');
    }
  }
};

// ---------- learning a new move ----------
CC.learnMove = async function (m, mv) {
  var name = CC.mon.name(m), mn = CC.MOVES[mv].name;
  if (CC.mon.knows(m, mv)) return;
  if (m.moves.length < 4) {
    m.moves.push({ id: mv, pp: CC.MOVES[mv].pp }); CC.sfx('levelup');
    await CC.say(name + ' learned ' + mn + '!'); return;
  }
  while (true) {
    await CC.say(name + ' wants to learn ' + mn + ', but already knows 4 moves.');
    var items = m.moves.map(function (x) { return CC.MOVES[x.id].name; }).concat(['Don\'t learn ' + mn]);
    var c = await CC.ask('Forget which move for ' + mn + '?', items);
    if (c >= 0 && c < 4) {
      var old = CC.MOVES[m.moves[c].id].name;
      m.moves[c] = { id: mv, pp: CC.MOVES[mv].pp }; CC.sfx('levelup');
      await CC.say('1, 2, and... poof! ' + name + ' forgot ' + old + ' and learned ' + mn + '!'); return;
    }
    if (await CC.yesNo('Give up on learning ' + mn + '?')) { await CC.say(name + ' did not learn ' + mn + '.'); return; }
  }
};

// ---------- evolution ----------
// Shows the two shapes flickering faster and faster. B stops it. Resolves to true if it evolved.
CC.evolveScene = function (m) {
  return new Promise(function (resolve) {
    var fromId = m.id, toId = CC.CREATURES[m.id].evo.into, t = 0, phase = 'intro', cancelled = false, showNew = false;
    var scr = {
      opaque: true,
      update: function (dt) {
        t += dt;
        if (phase === 'flicker' && CC.input.pressed.b) { cancelled = true; phase = 'done'; }
        if (phase === 'flicker') {
          var rate = 1.6 + t * t * 0.9; showNew = Math.sin(t * rate * Math.PI) > 0;
          if (Math.random() < 0.3) CC.fx.add({ x: CC.rand(60, 180), y: 150, vx: 0, vy: -CC.rand(30, 70), life: 1.5, kind: 'star', color: '#ffffff', size: 3 });
          if (t > 6) { phase = 'flash'; t = 0; CC.sfx('evolve'); }
        } else if (phase === 'flash' && t > 1.2) phase = 'done';
      },
      draw: function () {
        CC.rect(0, 0, 240, 160, '#1e1a30');
        for (var i = 0; i < 12; i++) { var a = CC.time * 0.4 + i * Math.PI / 6; CC.g.fillStyle = 'rgba(120,110,200,0.12)'; CC.g.beginPath(); CC.g.moveTo(120, 76); CC.g.arc(120, 76, 200, a, a + 0.18); CC.g.fill(); }
        var id = phase === 'flash' || (phase === 'done' && !cancelled) ? toId : phase === 'flicker' && showNew ? toId : fromId;
        var sil = phase === 'flicker' ? '#ffffff' : null;
        CC.drawSprite(CC.creatureSprite(id), 120, 100, { scale: 1.25, flash: sil, id: id, sy: 1 + Math.sin(CC.time * 4) * 0.03 });
        if (phase === 'flash') { CC.g.globalAlpha = Math.max(0, 1 - t); CC.rect(0, 0, 240, 160, '#ffffff'); CC.g.globalAlpha = 1; }
      },
    };
    CC.push(scr);
    (async function () {
      CC.sfx('statup');
      await CC.say('What? ' + CC.CREATURES[fromId].name + ' is evolving!', { auto: 1.2 });
      phase = 'flicker'; t = 0;
      await CC.until(function () { return phase === 'done'; });
      if (cancelled) {
        await CC.say('Huh? ' + CC.CREATURES[fromId].name + ' stopped evolving.');
        CC.pop(scr); resolve(false); return;
      }
      var newMoves = CC.mon.evolve(m);
      await CC.say('Congratulations! ' + CC.CREATURES[fromId].name + ' evolved into ' + CC.CREATURES[toId].name + '!');
      CC.markCaught(toId);
      for (var i = 0; i < newMoves.length; i++) await CC.learnMove(m, newMoves[i]);
      CC.pop(scr); resolve(true);
    })();
  });
};

var SOLID = { T: 1, '~': 1, o: 1, S: 1, '=': 1 };

function hash(x, y) { var h = (x * 374761393 + y * 668265263) | 0; h = (h ^ (h >> 13)) * 1274126177; return ((h ^ (h >> 16)) >>> 0) / 4294967295; }

CC.tileAt = function (map, x, y) {
  if (y < 0 || y >= map.rows.length || x < 0 || x >= map.rows[0].length) return null;
  var t = map.rows[y][x];
  if (t === '=' && CC.state.flags.logCleared) return ':';
  return t;
};

// ---------- drawing tiles into a map picture ----------
function drawTile(g, t, x, y, map) {
  var px = x * T, py = y * T, r = hash(x, y);
  var grass = function () {
    g.fillStyle = '#78c850'; g.fillRect(px, py, T, T);
    g.fillStyle = '#88d860';
    for (var i = 0; i < 3; i++) g.fillRect(px + Math.floor(hash(x + i, y) * 14), py + Math.floor(hash(x, y + i) * 14), 2, 1);
    g.fillStyle = '#5aa840';
    for (var j = 0; j < 2; j++) g.fillRect(px + Math.floor(hash(x * 3 + j, y) * 14), py + Math.floor(hash(x, y * 3 + j) * 13), 1, 2);
  };
  switch (t) {
    case '.': grass(); break;
    case '*': grass();
      [[3, 4], [10, 9], [6, 12]].forEach(function (p, i) {
        g.fillStyle = ['#f8f0f8', '#f8d040', '#f07ab0'][(i + Math.floor(r * 3)) % 3]; g.fillRect(px + p[0], py + p[1], 3, 3);

    case ',': // tall grass: dark tufts with visible blades

      for (var k = 0; k < 4; k++) {
        var bx = px + (k % 2) * 8, by = py + Math.floor(k / 2) * 8;
        g.fillStyle = '#2f7a2a'; g.fillRect(bx + 1, by + 3, 6, 5);
        g.fillStyle = '#5ab848'; g.fillRect(bx + 1, by + 1, 1, 5); g.fillRect(bx + 3, by, 1, 6); g.fillRect(bx + 5, by + 1, 1, 5);
        g.fillStyle = '#90e070'; g.fillRect(bx + 3, by, 1, 2);
      } break;
    case ':':
      g.fillStyle = '#e0c890'; g.fillRect(px, py, T, T);

      for (var q = 0; q < 4; q++) g.fillRect(px + Math.floor(hash(x + q * 7, y) * 14), py + Math.floor(hash(x, y + q * 5) * 14), 2, 2);
      break;
    case 'T':
      grass();
      g.fillStyle = '#7a5232'; g.fillRect(px + 6, py + 10, 4, 6);
      g.fillStyle = '#2a6e34'; g.beginPath(); g.arc(px + 8, py + 7, 7.5, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#3f8a3a'; g.beginPath(); g.arc(px + 7, py + 6, 6, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#5aa848'; g.fillRect(px + 4, py + 3, 3, 2); g.fillRect(px + 9, py + 5, 2, 2);
      g.fillStyle = '#1e4a26'; g.fillRect(px + 2, py + 11, 12, 1);
      break;
    case '~':
      g.fillStyle = '#3a8ee8'; g.fillRect(px, py, T, T);
      g.fillStyle = '#5aa8f0'; g.fillRect(px + 2 + Math.floor(r * 6), py + 4, 5, 1); g.fillRect(px + 7, py + 11, 5, 1);
      if (CC.tileAt(map, x, y - 1) !== '~') { g.fillStyle = '#e0c890'; g.fillRect(px, py, T, 2); g.fillStyle = '#8fd0ff'; g.fillRect(px, py + 2, T, 1); }
      break;
    case 'o':
      grass();
      g.fillStyle = '#5a5060'; g.fillRect(px + 2, py + 5, 12, 10);
      g.fillStyle = '#9a90a0'; g.fillRect(px + 3, py + 5, 10, 8);

    case 'S':

      g.fillStyle = '#3a2a22'; g.fillRect(px + 2, py + 2, 12, 8);
      g.fillStyle = '#c89a5a'; g.fillRect(px + 3, py + 3, 10, 6);
      g.fillStyle = '#a87a40'; g.fillRect(px + 4, py + 5, 8, 1); g.fillRect(px + 4, py + 7, 6, 1);
      break;
    case '=':
      g.fillStyle = '#e0c890'; g.fillRect(px, py, T, T);
      if (!CC.state.flags.logCleared) {
        g.fillStyle = '#3a2a1a'; g.fillRect(px, py + 4, T, 10);
        g.fillStyle = '#7a5232'; g.fillRect(px, py + 5, T, 8);
        g.fillStyle = '#9a6a42'; g.fillRect(px, py + 6, T, 2);
        g.fillStyle = '#4f9a40'; g.fillRect(px + Math.floor(r * 10), py + 4, 5, 2);
      }
      break;
  }
}

function drawBuilding(g, b) {
  var px = b.x * T, py = b.y * T, w = b.w * T, h = b.h * T;
  // walls
  g.fillStyle = '#3a2a22'; g.fillRect(px, py + 14, w, h - 14);
  g.fillStyle = b.wall; g.fillRect(px + 1, py + 15, w - 2, h - 16);
  g.fillStyle = CC.shade(b.wall, -0.15); g.fillRect(px + 1, py + h - 4, w - 2, 3);
  // roof
  g.fillStyle = '#2a1a1a'; g.fillRect(px - 2, py - 2, w + 4, 20);
  g.fillStyle = b.roof; g.fillRect(px - 1, py - 1, w + 2, 18);
  g.fillStyle = CC.shade(b.roof, 0.25);
  for (var i = 0; i < w + 2; i += 4) g.fillRect(px - 1 + i, py - 1, 2, 18);
  g.fillStyle = CC.shade(b.roof, -0.25); g.fillRect(px - 1, py + 14, w + 2, 3);
  if (b.stripe) { g.fillStyle = b.stripe; for (var s = 0; s < w; s += 8) g.fillRect(px + s, py + 16, 4, 4); }
  // windows
  var dx = (b.door[0] - b.x) * T;
  for (var wx = 4; wx < w - 8; wx += 16) {
    if (Math.abs(wx - dx) < 14) continue;
    g.fillStyle = '#3a2a22'; g.fillRect(px + wx, py + 24, 10, 9);
    g.fillStyle = '#8fd0ff'; g.fillRect(px + wx + 1, py + 25, 8, 7);
    g.fillStyle = '#e4faff'; g.fillRect(px + wx + 1, py + 25, 3, 2);
  }
  // door
  var ddx = px + dx + 3, ddy = py + (b.door[1] - b.y) * T;
  g.fillStyle = '#3a2a22'; g.fillRect(ddx - 1, ddy - 1, 12, 17);
  g.fillStyle = '#8a5a32'; g.fillRect(ddx, ddy, 10, 16);
  g.fillStyle = '#a87a48'; g.fillRect(ddx + 1, ddy + 1, 3, 14);
  g.fillStyle = '#f8d040'; g.fillRect(ddx + 7, ddy + 8, 2, 2);
  if (b.heart) {
    g.fillStyle = '#f07ab0'; g.fillRect(ddx + 2, ddy - 10, 2, 2); g.fillRect(ddx + 6, ddy - 10, 2, 2); g.fillRect(ddx + 1, ddy - 9, 8, 3); g.fillRect(ddx + 3, ddy - 6, 4, 1); g.fillRect(ddx + 4, ddy - 5, 2, 1);
  }
  if (b.id === 'shop') { var keep = CC.g; CC.g = g; CC.drawCube(ddx + 5, ddy - 8, 8); CC.g = keep; }
}

CC.buildMapPicture = function (id) {
  var map = CC.MAPS[id], w = map.rows[0].length, h = map.rows.length;
  var cv = CC.makeCanvas(w * T, h * T), g = cv.getContext('2d');
  for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) drawTile(g, CC.tileAt(map, x, y), x, y, map);
  map.buildings.forEach(function (b) { drawBuilding(g, b); });
  map.picture = cv;
};

// ---------- the world screen ----------
CC.world = {
  opaque: true,
  map: null, mapId: null, npcs: [],
  px: 0, py: 0, moving: null, stepAnim: 0, cooldown: 0, busy: false, hop: null, emote: null,

  enter: function (mapId, x, y, dir) {
    var s = CC.state;
    s.map = mapId; s.x = x; s.y = y; if (dir) s.dir = dir;
    this.mapId = mapId; this.map = CC.MAPS[mapId];
    if (!this.map.picture) CC.buildMapPicture(mapId);
    this.px = x * T; this.py = y * T; this.moving = null;
    this.npcs = (CC.NPCS[mapId] || []);
    this.banner = { text: this.map.name, t: 2.2 };
  },
  refresh: function () { CC.buildMapPicture(this.mapId); },

  solidAt: function (x, y) {
    var t = CC.tileAt(this.map, x, y);
    if (t === null) return true;
    if (SOLID[t]) return true;
    if (this.buildingAt(x, y)) return true;
    return !!this.npcAt(x, y);
  },
  buildingAt: function (x, y) {
    return this.map.buildings.find(function (b) { return x >= b.x && x < b.x + b.w && y >= b.y && y < b.y + b.h; });
  },
  npcAt: function (x, y) {
    return this.npcs.find(function (n) { return (!n.when || n.when()) && n.x === x && n.y === y; });
  },
  exitAt: function (x, y) {
    var m = this.map, w = m.rows[0].length, h = m.rows.length;
    return m.exits.find(function (e) {
      if (e.side === 'top') return y < 0 && x >= e.x0 && x <= e.x1;
      if (e.side === 'bottom') return y >= h && x >= e.x0 && x <= e.x1;
      return false;
    });
  },

  run: function (fn) { // runs an async script with the player frozen
    var self = this; self.busy = true;
    return Promise.resolve().then(fn).catch(function (e) { console.error(e); }).then(function () { self.busy = false; });
  },

  update: function (dt) {
    var s = CC.state, inp = CC.input;
    s.playTime += dt;
    if (this.busy) return;
    if (this.moving) {
      var mv = this.moving, speed = inp.held.b ? 8 : 4.4;
      mv.k += dt * speed;
      this.stepAnim += dt * speed;
      if (mv.k >= 1) {
        this.moving = null; s.x = mv.tx; s.y = mv.ty; this.px = s.x * T; this.py = s.y * T;
        this.afterStep();
      } else { this.px = CC.lerp(mv.fx, mv.tx, mv.k) * T; this.py = CC.lerp(mv.fy, mv.ty, mv.k) * T; return; }
      if (this.busy) return;
    }
    if (inp.pressed.start) { CC.sfx('select'); this.run(CC.fieldMenu); return; }
    if (inp.pressed.a) { this.interact(); return; }
    var dir = inp.held.up ? 'up' : inp.held.down ? 'down' : inp.held.left ? 'left' : inp.held.right ? 'right' : null;
    if (!dir) { this.stepAnim = 0; return; }
    s.dir = dir;
    var d = CC.DIRS[dir], nx = s.x + d[0], ny = s.y + d[1];
    var ex = this.exitAt(nx, ny);
    if (ex) { this.run(function () { return CC.useExit(ex, nx); }); return; }
    if (this.blockScript && this.blockScript(nx, ny)) return;
    var b = this.buildingAt(nx, ny);
    if (b && b.door[0] === nx && b.door[1] === ny && dir === 'up') { var self = this; this.run(function () { return CC.enterDoor(self.mapId, b.id); }); return; }
    if (this.solidAt(nx, ny)) { if (!this.bumped || CC.time - this.bumped > 0.3) { CC.sfx('bump'); this.bumped = CC.time; } return; }
    this.moving = { fx: s.x, fy: s.y, tx: nx, ty: ny, k: 0 };
  },

  afterStep: function () {
    var s = CC.state; s.steps++;
    if (this.cooldown > 0) this.cooldown--;
    var trig = CC.TRIGGERS[this.mapId] && CC.TRIGGERS[this.mapId](s.x, s.y);
    if (trig) { this.run(trig); return; }
    if (CC.tileAt(this.map, s.x, s.y) === ',') {
      for (var i = 0; i < 4; i++) CC.fx.add({ x: this.screenX(s.x * T + 8), y: this.screenY(s.y * T + 12), vx: CC.rand(-20, 20), vy: CC.rand(-30, -10), life: 0.3, kind: 'grass', color: '#5ab848', size: 3, grav: 120 });
      if (this.map.spawns && CC.firstHealthy() >= 0 && this.cooldown <= 0 && Math.random() < 0.12) {
        var self = this; this.run(function () { return CC.wildEncounter(self.map.spawns); });
      }
    }
  },

  interact: function () {
    var s = CC.state, d = CC.DIRS[s.dir], fx = s.x + d[0], fy = s.y + d[1];
    var n = this.npcAt(fx, fy);
    if (n) {
      var back = { up: 'down', down: 'up', left: 'right', right: 'left' };
      n.dir = back[s.dir];
      this.run(n.talk); return;
    }
    var t = CC.tileAt(this.map, fx, fy);
    if (t === 'S') { var sign = CC.SIGNS[this.mapId + ':' + fx + ',' + fy]; if (sign) this.run(function () { return CC.say(sign); }); return; }
    var b = this.buildingAt(fx, fy);
    if (b && b.door[0] === fx && b.door[1] === fy) { var self = this; this.run(function () { return CC.enterDoor(self.mapId, b.id); }); }
  },

  camX: function () { var w = this.map.rows[0].length * T; return w <= CC.W ? (w - CC.W) / 2 : CC.clamp(this.px + 8 - CC.W / 2, 0, w - CC.W); },
  camY: function () { var h = this.map.rows.length * T; return h <= CC.H ? (h - CC.H) / 2 : CC.clamp(this.py + 8 - CC.H / 2, 0, h - CC.H); },
  screenX: function (x) { return x - Math.round(this.camX()); },
  screenY: function (y) { return y - Math.round(this.camY()); },

  draw: function () {
    var g = CC.g, cx = Math.round(this.camX()), cy = Math.round(this.camY()), s = CC.state, self = this;
    CC.rect(0, 0, CC.W, CC.H, '#2a6e34');
    g.drawImage(this.map.picture, -cx, -cy);
    // water shimmer
    var rows = this.map.rows;
    g.fillStyle = 'rgba(255,255,255,0.55)';
    for (var y = Math.max(0, Math.floor(cy / T)); y < Math.min(rows.length, Math.ceil((cy + CC.H) / T)); y++) {
      for (var x = Math.max(0, Math.floor(cx / T)); x < Math.min(rows[0].length, Math.ceil((cx + CC.W) / T)); x++) {
        if (rows[y][x] === '~') { var ph = Math.floor((CC.time * 2 + hash(x, y) * 4) % 4); g.fillRect(x * T - cx + 3 + ph * 2, y * T - cy + 7, 3, 1); }
      }
    }
    // people, sorted by y
    var who = this.npcs.filter(function (n) { return !n.when || n.when(); }).map(function (n) {
      return { y: n.y * T, draw: function () { self.drawPerson(n.look, n.dir || 'down', n.x * T, n.y * T, n.walk ? Math.floor(CC.time * 4) % 2 : 0, n); } };
    });
    var step = this.moving ? Math.floor(this.stepAnim * 2) % 2 : 0;
    who.push({ y: this.py, draw: function () { self.drawPerson('player', s.dir, self.px, self.py, step, null); } });
    who.sort(function (a, b) { return a.y - b.y; }).forEach(function (o) { o.draw(); });
    // a creature hopping out of the grass
    if (this.hop) {
      var h = this.hop, k = CC.clamp(h.k, 0, 1), arc = Math.sin(k * Math.PI) * 18;
      var hx = this.screenX(h.x * T + 8), hy = this.screenY(h.y * T + 14);
      g.fillStyle = 'rgba(0,0,0,0.25)'; g.beginPath(); g.ellipse(hx, hy, 6, 2, 0, 0, Math.PI * 2); g.fill();
      CC.drawSprite(CC.creatureSprite(h.id), hx, hy - arc, { scale: 0.32 + k * 0.08, sy: 1 + Math.sin(CC.time * 20) * 0.08 * (1 - k), id: h.id });
    }
    if (this.emote) {
      var ex = this.screenX(this.px + 8), ey = this.screenY(this.py - 14);
      CC.rect(ex - 5, ey - 6, 11, 12, '#3a2a22'); CC.rect(ex - 4, ey - 5, 9, 10, '#ffffff');
      CC.rect(ex - 1, ey - 4, 3, 5, '#e84838'); CC.rect(ex - 1, ey + 2, 3, 2, '#e84838');
    }
    if (this.banner) { this.banner.t -= CC.dt || 0; if (this.banner.t <= 0) this.banner = null; }
    if (this.banner) {
      var a = Math.min(1, this.banner.t * 2, (2.2 - this.banner.t) * 4);
      g.globalAlpha = a; var bw = CC.textWidth(this.banner.text) + 20;
      CC.box(6, 6, bw, 20); CC.text(this.banner.text, 16, 10); g.globalAlpha = 1;
    }
  },

  drawPerson: function (look, dir, x, y, step, npc) {
    var sx = this.screenX(x) - 4, sy = this.screenY(y) - 10;
    if (sx < -24 || sy < -24 || sx > CC.W || sy > CC.H) return;
    var g = CC.g;
    g.fillStyle = 'rgba(0,0,0,0.22)'; g.beginPath(); g.ellipse(sx + 12, sy + 23, 6, 2, 0, 0, Math.PI * 2); g.fill();
    var bob = npc && !npc.walk ? Math.round(Math.sin(CC.time * 2 + (npc.x || 0)) * 0.5) : 0;
    g.drawImage(CC.person(look, dir, step), sx, sy + bob);
    // standing in tall grass hides the feet
    var tx = Math.round(x / T), ty = Math.round(y / T);
    if (CC.tileAt(this.map, tx, ty) === ',') {
      g.drawImage(this.map.picture, tx * T, ty * T + 8, T, 8, this.screenX(tx * T), this.screenY(ty * T + 8), T, 8);
    }
  },
};
CC.DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };

CC.useExit = async function (ex, nx) {
  if (ex.to === 'forest') { await CC.forestGate(); return; }
  var dest = CC.MAPS[ex.to];
  await CC.fade(0.25, true);
  var x = ex.tx0 + (nx - ex.x0);
  CC.world.enter(ex.to, x, ex.ty, ex.side === 'top' ? 'up' : 'down');
  CC.world.cooldown = 2;
  await CC.fade(0.25, false);
  return dest;
};

// a screen-wide fade
CC.fade = function (sec, toBlack) {
  var k = toBlack ? 0 : 1;
  var scr = { draw: function () { CC.g.globalAlpha = k; CC.rect(0, 0, CC.W, CC.H, '#000'); CC.g.globalAlpha = 1; }, update: function () {} };
  CC.push(scr);
  return CC.tween(sec, function (t) { k = toBlack ? t : 1 - t; }).then(function () { if (!toBlack) CC.pop(scr); else CC.fadeScreen = scr; });
};
CC.unfade = function () { if (CC.fadeScreen) { CC.pop(CC.fadeScreen); CC.fadeScreen = null; } };

// ---------- wild encounters: the grass shakes, the creature hops out, then the battle ----------
CC.rollSpawn = function (key) {
  var sp = CC.SPAWNS[key];
  var r = Math.random() * 100, tier = r < 60 ? 'common' : r < 90 ? 'uncommon' : 'rare';
  if (!sp[tier].length) tier = 'common';
  return { id: CC.pick(sp[tier]), lv: CC.randi(sp.levels[0], sp.levels[1]) };
};
CC.wildEncounter = async function (key) {
  var w = CC.world, s = CC.state, roll = CC.rollSpawn(key);
  w.cooldown = 3;
  // where it jumps from: the tall grass in front of you if there is some, else your own patch
  var d = CC.DIRS[s.dir], hx = s.x + d[0], hy = s.y + d[1];
  if (CC.tileAt(w.map, hx, hy) !== ',') { hx = s.x; hy = s.y; }
  CC.sfx('rustle');
  for (var i = 0; i < 10; i++) CC.fx.add({ x: w.screenX(hx * T + 8), y: w.screenY(hy * T + 10), vx: CC.rand(-40, 40), vy: CC.rand(-60, -20), life: 0.5, kind: 'grass', color: CC.pick(['#5ab848', '#90e070', '#2f7a2a']), size: 4, grav: 160, spin: 8 });
  w.emote = true; CC.sfx('encounter');
  await CC.sleep(0.35);
  w.hop = { id: roll.id, x: hx, y: hy, k: 0 };
  await CC.tween(0.45, function (k) { w.hop.k = k; });
  await CC.sleep(0.25);
  w.emote = false;
  await CC.battleTransition();
  w.hop = null;
  await CC.startBattle({ wild: CC.mon.make(roll.id, roll.lv) });
};

// bars sweep in from both sides, flashing, then the battle starts
CC.battleTransition = function () {
  var k = 0;
  var scr = {
    update: function () {},
    draw: function () {
      var flash = k < 0.3 && Math.floor(k * 20) % 2;
      if (flash) { CC.g.globalAlpha = 0.6; CC.rect(0, 0, CC.W, CC.H, '#ffffff'); CC.g.globalAlpha = 1; }
      var kk = CC.clamp((k - 0.3) / 0.7, 0, 1);
      for (var i = 0; i < 10; i++) {
        var w = CC.W * CC.ease(CC.clamp(kk * 1.6 - i * 0.06, 0, 1));
        CC.rect(i % 2 ? CC.W - w : 0, i * 16, w, 16, '#1e1626');
      }
    },
  };
  CC.push(scr);
  return CC.tween(0.9, function (t) { k = t; }).then(function () { CC.pop(scr); });
};

// ---------- the field menu ----------
CC.fieldMenu = async function () {
  while (true) {
    var items = ['Party', 'Bag'];
    if (CC.state.flags.vaultKey) items.push('Vault');
    items.push('Save', 'Close');
    var c = await CC.menu(items, { x: 158, y: 6, w: 76, startCloses: true });
    var pick = items[c];
    if (c < 0 || pick === 'Close') return;
    if (pick === 'Party') await CC.partyScreen('field');
    if (pick === 'Bag') await CC.bagScreen();
    if (pick === 'Vault') await CC.vaultScreen();
    if (pick === 'Save') {
      var seen = Object.keys(CC.state.seen).length, caught = Object.keys(CC.state.caught).length;
      if (await CC.yesNo('Save your game? (Creature Log: ' + caught + ' caught, ' + seen + ' seen. Coins: ' + CC.state.coins + '.)')) {
        if (CC.saveGame()) { CC.sfx('select'); await CC.say('Your game is saved.'); } else await CC.say('This browser won\'t let the game save, sorry.');
      }
    }
  }
};

<script>/* 06-battle.js */
// Battles: 1 v 1, turn based. Fight / Cube / Swap / Run. The rules are in docs/creature-catch-handoff.md
// section 5 and docs/creature-catch-decisions-2.md. Every animation is code moving the one still sprite.
var CC = window.CC || (window.CC = {});

(function () {
  var FOE = { x: 176, y: 72 }, ALLY = { x: 62, y: 114 };

  function stageMult(n) { return n >= 0 ? 1 + 0.25 * n : 1 / (1 + 0.25 * -n); }
  function freshStages() { return { atk: 0, def: 0, spd: 0, acc: 0 }; }
  function side(mon, isFoe) {
    return { mon: mon, foe: isFoe, st: freshStages(), home: isFoe ? FOE : ALLY, ox: 0, oy: 0, sx: 1, sy: 1, scale: 0, alpha: 1, flash: null, wave: 0, hpShown: mon ? mon.hp : 0, overlay: null };
  }
  function nm(s) { return (s.foe ? (B.wild ? 'The wild ' : B.trainer.name + '\'s ') : '') + CC.mon.name(s.mon); }
  function nmShort(s) { return CC.mon.name(s.mon); }

  var B = null; // the battle now running
  CC.currentBattle = function () { return B; };

  CC.startBattle = function (opts) {
    return new Promise(function (resolve) {
      B = {
        wild: !!opts.wild, trainer: opts.trainer || null, resolve: resolve,
        foeTeam: opts.wild ? [opts.wild] : opts.trainer.team, foeIndex: 0,
        allyIndex: CC.firstHealthy(), runs: 0, fought: {}, leveled: {}, shake: 0, flashScreen: 0, intro: 0, trainerShown: !!opts.trainer,
        bg: opts.bg || (CC.world.map && CC.world.map.spawns) || 'grassland',
      };
      B.foe = side(B.foeTeam[0], true);
      B.ally = side(null, false);
      B.foe.scale = 0;
      CC.markSeen(B.foe.mon.id);
      CC.fx.clear();
      CC.push(screen);
      battle().catch(function (e) { console.error(e); }).then(function (result) {
        CC.pop(screen); CC.fx.clear();
        var r = B.resolve; B = null; r(result);
      });
    });
  };

  // ---------- drawing ----------
  function drawBackground() {
    var g = CC.g, bg = B.bg;
    var sky = bg === 'meadow' ? ['#a8e0f8', '#e0f4ff'] : ['#90d0f8', '#d8f0ff'];
    var grd = g.createLinearGradient(0, 0, 0, 90); grd.addColorStop(0, sky[0]); grd.addColorStop(1, sky[1]);
    g.fillStyle = grd; g.fillRect(0, 0, 240, 112);
    // clouds
    g.fillStyle = '#ffffff';
    [[30, 18], [150, 10], [210, 26]].forEach(function (c, i) { var x = (c[0] + CC.time * (3 + i)) % 280 - 30; g.fillRect(x, c[1], 22, 5); g.fillRect(x + 5, c[1] - 3, 12, 4); });
    // hills
    g.fillStyle = '#9ad878'; g.beginPath(); g.moveTo(0, 70);
    for (var x = 0; x <= 240; x += 8) g.lineTo(x, 62 + Math.sin(x * 0.03) * 6 + Math.sin(x * 0.08) * 2);
    g.lineTo(240, 112); g.lineTo(0, 112); g.fill();
    g.fillStyle = '#78c850'; g.fillRect(0, 80, 240, 32);
    g.fillStyle = '#6ab848'; for (var i = 0; i < 24; i++) g.fillRect((i * 37) % 240, 84 + (i * 13) % 26, 3, 1);
    // platforms
    plat(FOE.x, FOE.y - 2, 40, 9, '#8ad868', '#5aa840');
    plat(ALLY.x, ALLY.y - 3, 48, 10, '#8ad868', '#5aa840');
  }
  function plat(x, y, rx, ry, top, edge) {
    var g = CC.g;
    g.fillStyle = edge; g.beginPath(); g.ellipse(x, y + 2, rx, ry, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = top; g.beginPath(); g.ellipse(x, y, rx - 2, ry - 2, 0, 0, Math.PI * 2); g.fill();
  }

  function drawMon(s) {
    if (!s.mon || s.scale <= 0) return;
    var m = s.mon, sprite = CC.creatureSprite(m.id), sp = CC.mon.sp(m);
    var t = CC.time + (s.foe ? 1.3 : 0);
    var frozen = m.status === 'freeze', asleep = m.status === 'sleep';
    var breathe = frozen ? 0 : Math.sin(t * (asleep ? 1.4 : 2.6)) * (asleep ? 0.04 : 0.028);
    var jitter = m.status === 'shock' && Math.random() < 0.08 ? CC.rand(-1, 1) : 0;
    var low = m.hp > 0 && m.hp / CC.mon.maxHp(m) < 0.25 && !frozen ? Math.sin(t * 9) * 0.02 : 0;
    var ghosty = sp.look.body === 'ghost' ? 0.8 : 0;

  async function statFx(s, up) {

  // ---------- rules ----------
  function stats(s) {
    var b = CC.mon.stats(s.mon);
    return {
      atk: b.atk * stageMult(s.st.atk) * (s.mon.status === 'burn' ? 0.75 : 1),
      def: b.def * stageMult(s.st.def),
      spd: b.spd * stageMult(s.st.spd) * (s.mon.status === 'shock' ? 0.75 : 1),
    };
  }
  function damage(user, target, move, crit) {
    var a = stats(user), d = stats(target), L = user.mon.lv;
    var mult = move.type ? CC.typeMult(move.type, CC.mon.sp(target.mon).types) : 1;
    var stab = move.type && CC.mon.sp(user.mon).types.indexOf(move.type) >= 0 ? 1.25 : 1;
    var dmg = (((2 * L / 5 + 2) * move.power * a.atk / d.def) / 50 + 2) * mult * stab * CC.rand(0.9, 1) * (crit ? 1.5 : 1);
    return { dmg: mult === 0 ? 0 : Math.max(1, Math.floor(dmg)), mult: mult };
  }

  var STATUS_TEXT = { burn: 'was burned!', freeze: 'was frozen solid!', shock: 'is shocked! It may be unable to move!', poison: 'was poisoned!', sleep: 'fell asleep!' };
  var STAT_NAME = { atk: 'Attack', def: 'Defense', spd: 'Speed', acc: 'accuracy' };

  async function applyStatus(target, st, quiet) {
    if (target.mon.status || target.mon.hp <= 0) { if (!quiet) await CC.say('But it failed!'); return; }
    target.mon.status = st;

  async function applyStat(s, stat, n) {
    var cur = s.st[stat], next = CC.clamp(cur + n, -3, 3);
    if (next === cur) { await CC.say(nm(s) + '\'s ' + STAT_NAME[stat] + ' won\'t go any ' + (n > 0 ? 'higher!' : 'lower!')); return; }
    s.st[stat] = next;
    await statFx(s, n > 0);
    await CC.say(nm(s) + '\'s ' + STAT_NAME[stat] + (n > 1 ? ' rose sharply!' : n > 0 ? ' rose!' : n < -1 ? ' fell sharply!' : ' fell!'));
  }

  // returns true when it could act
  async function canAct(s) {

      await CC.say(nm(s) + ' is fast asleep.'); return false;
    }
    if (m.status === 'freeze') {
      if (Math.random() < 0.25) { m.status = null; await CC.say(nm(s) + ' thawed out!'); return true; }
      await CC.say(nm(s) + ' is frozen solid!'); return false;
    }
    if (m.status === 'shock' && Math.random() < 0.25) {
      CC.burst('Bolt', s.home.x, s.home.y - 28, 10, 50); CC.sfx('status');
      await CC.say(nm(s) + ' is shocked and can\'t move!'); return false;
    }
    return true;
  }

  async function useMove(user, target, mvId) {
    var move = CC.MOVES[mvId], fx = move.fx || {};
    if (mvId !== 'struggle') {
      var slot = user.mon.moves.find(function (x) { return x.id === mvId; });
      if (slot) slot.pp = Math.max(0, slot.pp - 1);
    }
    await CC.say(nm(user) + ' used ' + move.name + '!', { auto: 0.35 });
    // accuracy
    if (move.acc && !(fx.self || fx.heal)) {
      var acc = move.acc * stageMult(user.st.acc);
      if (Math.random() * 100 >= acc) { await CC.say(nm(user) + '\'s attack missed!'); return; }
    }
    await moveAnim(user, target, move);
    if (move.power) {
      var hits = fx.hits ? CC.randi(fx.hits[0], fx.hits[1]) : 1, total = 0, last = null, n = 0;
      for (var h = 0; h < hits && target.mon.hp > 0; h++) {
        var crit = Math.random() < (fx.crit ? 0.25 : 0.0625);

        target.mon.hp = Math.max(0, target.mon.hp - r.dmg); total += r.dmg; last = r; n++;

        if (h < hits - 1 && target.mon.hp > 0) await CC.sleep(0.1);
      }
      if (last && last.mult > 1) await CC.say('It\'s super effective!');
      else if (last && last.mult < 1) await CC.say('It\'s not very effective...');
      if (hits > 1) await CC.say('It hit ' + n + ' times!');

          await CC.sleep(0.5);

        await CC.say(nm(user) + ' is hit with recoil!');

        if (fx.stat) await applyStat(fx.self ? user : target, fx.stat, fx.stages);
      } else if (fx.stat && fx.self && user.mon.hp > 0 && (!fx.chance || Math.random() * 100 < fx.chance)) await applyStat(user, fx.stat, fx.stages);

  }

          if (mv.type) CC.typeBadge(mv.type, 170, 131);
          var e = mv.power ? CC.typeMult(mv.type, CC.mon.sp(B.foe.mon).types) : 1;
          CC.text(mv.power ? 'Power ' + mv.power + (e > 1 ? ' ++' : e < 1 ? ' -' : '') : 'Effect', 170, 143, '#6a5a50', { size: 9 });
        },
      };
      CC.push(scr);
    });
  }
  async function chooseAction() {
    while (true) {
      var m = B.ally.mon;
      var a = await actionMenu();
      if (a === 0) {
        if (!usableMoves(m).length) { await CC.say(nmShort(B.ally) + ' has no moves left!'); return { kind: 'move', move: 'struggle' }; }
        var mv = await fightMenu();
        if (mv) return { kind: 'move', move: mv };
      } else if (a === 1) {
        if (!B.wild) { await CC.say('You can\'t catch another trainer\'s creature!'); continue; }
        if (!CC.state.bag.cube) { await CC.say('You don\'t have any cubes!'); continue; }
        return { kind: 'cube' };
      } else if (a === 2) {
        var i = await CC.partyScreen('battle', { active: B.allyIndex, title: 'Swap in which?' });
        if (i >= 0) return { kind: 'swap', index: i };
      } else if (a === 3) {
        if (!B.wild) { await CC.say('No running from a trainer battle!'); continue; }
        return { kind: 'run' };
      }
    }
  }

  // ---------- catching ----------
  var RARITY_BONUS = { common: 25, uncommon: 10, rare: -5, veryrare: -15 };
  function catchChance(m) {
    var max = CC.mon.maxHp(m), st = m.status;
    var c = (1 - m.hp / max) * 70 + (st === 'sleep' || st === 'freeze' ? 15 : st ? 8 : 0) + (RARITY_BONUS[CC.RARITY[m.id]] || 0);
    return CC.clamp(c, 5, 95);
  }
  async function throwCube() {
    CC.state.bag.cube--;
    await CC.say('You threw a Basic Cube!', { auto: 0.2 });
    var f = B.foe, to = { x: f.home.x, y: f.home.y - 30 };
    B.cube = { x: 30, y: 120, rot: 0, open: 0 };
    CC.sfx('throw');
    await CC.tween(0.55, function (k) { B.cube.x = CC.lerp(30, to.x, k); B.cube.y = CC.lerp(120, to.y, k) - Math.sin(k * Math.PI) * 50; B.cube.rot = k * 12; });
    B.cube.rot = 0; B.cube.open = 4; B.cube.glow = 0.7;
    CC.fx.add({ x: to.x, y: to.y, vx: 0, vy: 0, life: 0.4, kind: 'glow', color: '#ffffff', size: 10, grow: 2 });
    f.flash = '#ffffff';
    await CC.tween(0.35, function (k) { f.scale = 1 - k; f.oy = -k * 26; });
    B.cube.open = 0; B.cube.glow = 0;
    await CC.tween(0.3, function (k) { B.cube.y = CC.lerp(to.y, f.home.y - 5, k * k); });
    CC.sfx('bump');
    var caught = Math.random() * 100 < catchChance(f.mon);
    var wobbles = caught ? 3 : CC.randi(0, 2);
    for (var i = 0; i < wobbles; i++) {
      await CC.sleep(0.45);
      CC.sfx('wobble');
      await CC.tween(0.4, function (k) { B.cube.rot = Math.sin(k * Math.PI * 2) * 0.45 * (i % 2 ? -1 : 1); B.cube.x = to.x + Math.sin(k * Math.PI * 2) * 2; });
    }
    await CC.sleep(0.4);
    if (caught) {
      CC.sfx('catch');
      for (var j = 0; j < 10; j++) CC.fx.add({ x: B.cube.x, y: B.cube.y, vx: CC.rand(-40, 40), vy: CC.rand(-70, -20), life: 0.8, kind: 'star', color: CC.pick(['#ffffff', '#f8e050', '#c88af8']), size: 4, grav: 120 });
      B.cube.glow = 0.4; await CC.sleep(0.3); B.cube.glow = 0;
      await CC.say('Gotcha! ' + CC.mon.name(f.mon) + ' was caught!');
      var where = CC.addCreature(f.mon);
      if (where === 'vault') await CC.say('Your party is full, so ' + CC.mon.name(f.mon) + ' was sent to the Cube Vault.');
      B.cube = null; f.oy = 0;
      return true;
    }
    CC.sfx('breakout');
    B.cube.open = 4; B.cube.glow = 0.9;
    CC.burst('Normal', to.x, to.y + 20, 12, 70, { kind: 'star' });
    await CC.tween(0.3, function (k) { f.scale = k; f.oy = -26 * (1 - k); });
    f.flash = null; f.oy = 0; B.cube = null;
    await CC.say(['Oh no! It broke free!', 'Argh! Almost had it!', 'Aww! It appeared to be caught!', 'Shoot! It was so close, too!'][wobbles]);
    return false;
  }

  // ---------- winning and growing ----------
  async function gainXp(foeMon) {
    var s = B.ally, m = s.mon;
    if (!m || m.hp <= 0 || m.lv >= 50) return;
    var gain = Math.max(1, Math.floor(CC.mon.sp(foeMon).xpYield * foeMon.lv / 5 * (B.wild ? 1 : 1.5)));
    await CC.say(nmShort(s) + ' gained ' + gain + ' XP!');
    var target = m.xp + gain;
    while (m.lv < 50) {
      var next = CC.mon.xpFor(m.lv + 1), from = m.xp, to = Math.min(target, next);
      s.xpShown = from;
      await CC.tween(0.5, function (k) { s.xpShown = CC.lerp(from, to, k); });
      m.xp = to;
      if (m.xp < next) break;
      var before = CC.mon.stats(m);
      m.lv++;
      var after = CC.mon.stats(m);
      m.hp += after.hp - before.hp; s.hpShown = m.hp;
      B.leveled[CC.state.party.indexOf(m)] = true;
      CC.sfx('levelup');
      for (var i = 0; i < 10; i++) CC.fx.add({ x: s.home.x + CC.rand(-20, 20), y: s.home.y, vx: 0, vy: -CC.rand(30, 60), life: 0.8, kind: 'star', color: '#f8e050', size: 3 });
      await CC.say(nmShort(s) + ' grew to Lv ' + m.lv + '!');
      var learn = CC.mon.newMovesAt(m.id, m.lv);
      for (var j = 0; j < learn.length; j++) await CC.learnMove(m, learn[j]);
    }
    if (m.lv >= 50) m.xp = CC.mon.xpFor(50);
    s.xpShown = null;
  }

  async function allyFainted() {
    await faintAnim(B.ally);
    await CC.say(nmShort(B.ally) + ' fainted!');
    if (CC.firstHealthy() < 0) return false;
    var i = await CC.partyScreen('battle', { active: B.allyIndex, title: 'Send out which?', mustPick: true });
    B.allyIndex = i; B.ally = side(CC.state.party[i], false);
    await CC.say('Go, ' + nmShort(B.ally) + '!', { auto: 0.3 });
    await sendOut(B.ally);
    return true;
  }

  // ---------- the battle ----------
  async function battle() {
    await CC.tween(0.5, function (k) { B.intro = k; });
    B.intro = 1;
    if (B.wild) {
      B.foe.scale = 1;
      await CC.tween(0.25, function (k) { B.foe.sy = 1 + Math.sin(k * Math.PI) * 0.2; B.foe.oy = -Math.sin(k * Math.PI) * 10; });
      CC.burst('Plant', FOE.x, FOE.y - 4, 10, 50, { kind: 'grass', grav: 150 });
      await CC.say('A wild ' + CC.mon.name(B.foe.mon) + ' jumped out!');
    } else {
      B.trainerX = 0;
      await CC.say(B.trainer.name + ' wants to battle!');
      if (B.trainer.intro) await CC.say(B.trainer.intro, { who: B.trainer.name });
      await CC.tween(0.3, function (k) { B.trainerX = k * 80; });
      B.trainerShown = false;
      await CC.say(B.trainer.name + ' sent out ' + CC.mon.name(B.foe.mon) + '!', { auto: 0.4 });
      await sendOut(B.foe);
    }
    B.ally = side(CC.state.party[B.allyIndex], false);
    await CC.say('Go, ' + nmShort(B.ally) + '!', { auto: 0.3 });
    await sendOut(B.ally);
    B.fought[B.allyIndex] = true;

    while (true) {
      var act = await chooseAction();
      var foeMove = foeChoice();
      if (act.kind === 'run') {
        B.runs++;
        var a = stats(B.ally).spd, b = stats(B.foe).spd;
        if (a >= b || Math.random() * 100 < 50 + 10 * B.runs) { CC.sfx('back'); await CC.say('Got away safely!'); return 'run'; }
        await CC.say('Couldn\'t get away!');
      } else if (act.kind === 'cube') {
        if (await throwCube()) { await afterWin(); return 'caught'; }
      } else if (act.kind === 'swap') {
        await CC.say('Come back, ' + nmShort(B.ally) + '!', { auto: 0.3 });
        await withdraw(B.ally);
        B.allyIndex = act.index; B.ally = side(CC.state.party[act.index], false); B.fought[act.index] = true;
        await CC.say('Go, ' + nmShort(B.ally) + '!', { auto: 0.3 });
        await sendOut(B.ally);
      }
      // the turn order
      var order = [];
      if (act.kind === 'move') {
        var pa = (CC.MOVES[act.move].fx || {}).priority || 0, pb = (CC.MOVES[foeMove].fx || {}).priority || 0;
        var sa = stats(B.ally).spd, sb = stats(B.foe).spd;
        var allyFirst = pa !== pb ? pa > pb : sa !== sb ? sa > sb : Math.random() < 0.5;
        order = allyFirst ? [['ally', act.move], ['foe', foeMove]] : [['foe', foeMove], ['ally', act.move]];
      } else order = [['foe', foeMove]];

      var ended = false;
      for (var i = 0; i < order.length && !ended; i++) {
        var user = order[i][0] === 'ally' ? B.ally : B.foe, target = user === B.ally ? B.foe : B.ally;
        if (user.mon.hp <= 0 || target.mon.hp <= 0) continue;
        if (await canAct(user)) await useMove(user, target, order[i][1]);
        var r = await checkFaints();
        if (r) { if (r !== 'next') return r; ended = true; }
      }
      if (ended) continue;
      for (var j = 0; j < 2; j++) {
        var who = j === 0 ? B.ally : B.foe;
        await residual(who);
        var r2 = await checkFaints();
        if (r2) { if (r2 !== 'next') return r2; break; }
      }
    }
  }

  // returns 'win' / 'lose' when the battle is over, 'next' when a new creature came out, or null
  async function checkFaints() {
    var out = null;
    if (B.foe.mon.hp <= 0) {
      await faintAnim(B.foe);
      await CC.say(nm(B.foe) + ' fainted!');
      await gainXp(B.foe.mon);
      if (!B.wild && B.foeIndex < B.foeTeam.length - 1) {
        B.foeIndex++;
        B.foe = side(B.foeTeam[B.foeIndex], true); CC.markSeen(B.foe.mon.id);
        await CC.say(B.trainer.name + ' sent out ' + CC.mon.name(B.foe.mon) + '!', { auto: 0.4 });
        await sendOut(B.foe);
        out = 'next';
      } else {
        await afterWin();
        return 'win';
      }
    }
    if (B.ally.mon.hp <= 0) {
      if (!(await allyFainted())) {
        if (B.trainer && B.trainer.loseText) await CC.say(B.trainer.loseText, { who: B.trainer.name });
        await CC.say('You have no creatures left that can fight...');
        return 'lose';
      }
      out = 'next';
    }
    return out;
  }

  async function afterWin() {
    var coins = B.wild ? B.foe.mon.lv * 4 : B.trainer.coins || 0;
    if (!B.wild) {
      B.trainerShown = true; B.trainerX = 80;
      await CC.tween(0.3, function (k) { B.trainerX = 80 * (1 - k); });
      if (B.trainer.winText) await CC.say(B.trainer.winText, { who: B.trainer.name });
    }
    if (coins) { CC.state.coins += coins; await CC.say('You got ' + coins + ' coins' + (B.wild ? '.' : ' for winning!')); }
    // evolution after the battle, for anyone who grew
    for (var k in B.leveled) {
      var m = CC.state.party[k];
      if (!m || m.hp <= 0 || !CC.mon.canEvolve(m)) continue;
      if (await CC.yesNo(CC.mon.name(m) + ' is ready to evolve! Let it?')) await CC.evolveScene(m);
      else await CC.say(CC.mon.name(m) + ' will ask again after its next level.');
    }
  }
})();

</script>
<script>/* 07-story.js */
// The first playable slice: Home Village, Meadow Path, Grassland. People, signs, doors and story beats.
var CC = window.CC || (window.CC = {});

var STARTERS = ['drizzlon', 'mossback', 'embroak'];
var STARTER_BLURB = { drizzlon: 'the little water dragon', mossback: 'the sleepy plant turtle', embroak: 'the cheeky fire frog' };
// Juniper always takes the starter that beats yours
var RIVAL_PICK = { drizzlon: 'mossback', mossback: 'embroak', embroak: 'drizzlon' };

function F() { return CC.state.flags; }

// a battle that sends you back to the last Healing Hut if you lose (unless losing is part of the story)
CC.fight = async function (opts) {
  var result = await CC.startBattle(opts);
  if (result === 'lose' && !opts.canLose) {
    await CC.fade(0.4, true);
    CC.healParty();
    var h = CC.state.lastHeal;
    CC.world.enter(h.map, h.x, h.y, 'down');
    CC.unfade();
    await CC.say('You hurried back to the Healing Hut. Your creatures are rested and ready.');
  }
  return result;
};

CC.NPCS = {
  village: [
    {
      x: 12, y: 1, look: 'tinker', dir: 'down', talk: async function () {
        if (!F().starter) await CC.say('Elder Willow is looking for you! His house is the big one with the mossy roof.', { who: 'Tinker' });
        else await CC.talk('Tinker', ['Creatures hide in tall grass. Walk through it and one might jump out!', 'Knock it down a bit, then throw a cube. Sleeping or frozen ones are easiest to catch!']);
      },
    },
    {
      x: 9, y: 13, look: 'rosa', dir: 'down', talk: async function () {
        await CC.talk('Rosa', ['Lovely day for the Meadow Path.', 'The creatures out there are plain Normal types. They don\'t care whether you picked water, fire or plant, so it\'s fair training for everyone.']);
      },
    },
  ],
  meadow: [
    {
      x: 3, y: 8, look: 'ranger', dir: 'right', talk: async function () {
        await CC.talk('Hiker', ['Every region has an outpost with a Healing Hut. The Grassland one is just north of here.', 'You can swap creatures with the Cube Vault at any Healing Hut.']);
      },
    },
  ],
  grassland: [
    {
      x: 12, y: 1, look: 'bramble', dir: 'down', id: 'bramble', talk: async function () {
        if (F().trial1) { await CC.say('The Forest trail is all yours. Mind the owls!', { who: 'Farmer Bramble' }); return; }
        await CC.talk('Farmer Bramble', ['Howdy! I\'m Farmer Bramble, guide of the Grassland.', 'That fallen log is the only way into the Forest, and I only clear it for trainers who can handle the creatures out there.']);
        if (!(await CC.yesNo('Ready for my trail trial?', 'Farmer Bramble'))) { await CC.say('Come back when you\'re ready. The outpost will patch you up.', { who: 'Farmer Bramble' }); return; }
        var r = await CC.fight({
          trainer: {
            name: 'Farmer Bramble', look: 'bramble', coins: 240,
            intro: 'My critters have been working the fields all morning. Show me what you\'ve got!',
            winText: 'Well I\'ll be! You\'ve earned it.', loseText: 'Ha! Not quite yet. Rest up and try again.',
            team: [CC.mon.make('hopsprout', 7), CC.mon.make('pebblepup', 7), CC.mon.make('tuftail', 8)],
          },
        });
        if (r !== 'win') return;
        F().trial1 = true;
        CC.sfx('catch');
        await CC.say('You got the Leaf Trail Charm!');
        await CC.talk('Farmer Bramble', ['One more thing. Hazel asked me to hand you this if you passed.']);
        F().vaultKey = true; CC.sfx('buy');
        await CC.say('You got the Vault Key! Now you can open the Cube Vault from the menu, anywhere.');
        await CC.say('Now, let\'s shift this log. Hup!', { who: 'Farmer Bramble' });
        F().logCleared = true;
        CC.world.refresh();
        B_moveAside();
        CC.sfx('bump');
        await CC.say('Farmer Bramble rolled the log out of the way. The trail into the Forest is open!');
      },
    },
    {
      x: 6, y: 11, look: 'tinker', dir: 'right', talk: async function () {
        await CC.talk('Farm Kid', ['Dandylion lives here, but it\'s super rare. I\'ve only seen its fluffy mane once!', 'Tuftail loves the tall grass by the trees.']);
      },
    },
  ],
};
function B_moveAside() {
  var b = CC.NPCS.grassland.find(function (n) { return n.id === 'bramble'; });
  b.x = 15; b.y = 2; b.dir = 'left';
}

CC.SIGNS = {
  'village:6,7': 'Home Village. Elder Willow: top left. Pip\'s Cube Shop: top right. Healing Hut: bottom right. Meadow Path: north.',
  'meadow:12,13': 'Meadow Path. The gentle creatures here are Normal types: fair training for every starter.',
  'grassland:18,14': 'Grassland Outpost: free healing and Cube Vault. Farmer Bramble keeps the north trail to the Forest.',
};

CC.TRIGGERS = {};

// Tinker won't let you leave without a creature
CC.world.blockScript = function (nx, ny) {
  if (CC.world.mapId === 'village' && ny <= 0 && !F().starter) {
    CC.world.run(async function () {
      await CC.say('Wait! It\'s not safe out there without a creature! Go see Elder Willow first.', { who: 'Tinker' });
    });
    return true;
  }
  return false;
};

// ---------- doors ----------
CC.enterDoor = async function (mapId, id) {
  if (id === 'willow') return willowHouse();
  if (id === 'shop') {
    await CC.say('Welcome to Pip\'s Cube Shop! Cubes, potions, all fresh.', { who: 'Pip' });
    await CC.shopScreen();
    await CC.say('Come again!', { who: 'Pip' });
    return;
  }
  if (id === 'home') {
    if (await CC.yesNo('Your home, sweet home. Take a rest?')) { await restAndHeal(); CC.state.lastHeal = { map: 'village', x: 4, y: 12 }; }
    return;
  }
  if (id === 'hut') return healingHut('Hazel', { map: 'village', x: 17, y: 12 });
  if (id === 'outpost') return healingHut('Fern', { map: 'grassland', x: 18, y: 12 });
};

async function restAndHeal() {
  await CC.fade(0.3, true);
  CC.healParty(); CC.sfx('heal');
  await CC.sleep(0.9);
  CC.unfade();
  await CC.say('Your creatures are healed and full of energy!');
}

async function healingHut(who, spot) {
  CC.state.lastHeal = spot;
  await CC.say(who === 'Hazel' ? 'Welcome to the Healing Hut! I\'m Hazel.' : 'Welcome to the Grassland Outpost! I\'m Fern, Hazel\'s cousin.', { who: who });
  while (true) {
    var c = await CC.ask('How can I help?', ['Heal my creatures', 'Cube Vault', 'Bye']);
    if (c === 0) {
      if (!CC.state.party.length) { await CC.say('You don\'t have any creatures yet!', { who: who }); continue; }
      await CC.say('Let me take care of them.', { who: who });
      await restAndHeal();
      CC.saveGame();
    } else if (c === 1) {
      if (!CC.state.party.length) { await CC.say('The Vault holds the creatures you catch once your party of 4 is full.', { who: who }); continue; }
      await CC.vaultScreen();
    } else { await CC.say('Take care out there!', { who: who }); return; }
  }
}

// ---------- the starter ----------
async function willowHouse() {
  if (F().starter) {
    var caught = Object.keys(CC.state.caught).length;
    await CC.talk('Elder Willow', [
      'How is your Creature Log coming along? ' + caught + ' caught so far!',
      F().trial1 ? 'Bramble tells me you passed the trail trial. The Forest awaits!' : 'Farmer Bramble guards the trail at the top of the Grassland. Beat his trial and he\'ll open the way to the Forest.',
    ]);
    return;
  }
  await CC.talk('Elder Willow', [
    'Ah, there you are! Today is the day you get your very first creature.',
    'Three cubes, three friends. Their types go round in a circle: Water beats Fire, Fire beats Plant, and Plant beats Water.',
    'Take your time. Pick the one that feels right.',
  ]);
  var pick = await starterSelect();
  F().starter = pick;
  var m = CC.mon.make(pick, 5);
  CC.addCreature(m);
  CC.sfx('catch');
  await CC.say('You received ' + CC.CREATURES[pick].name + '!');
  await CC.say('A fine choice. Look after each other.', { who: 'Elder Willow' });
  // Juniper bursts in
  var rival = RIVAL_PICK[pick];
  await CC.talk('Juniper', [
    'Gramps! I\'m here for my creature! Oh. You beat me to it?',
    'Fine! Then I\'ll take ' + CC.CREATURES[rival].name + '. ' + CC.CREATURES[rival].types[0] + ' beats ' + CC.CREATURES[pick].types[0] + ', you know!',
    'Let\'s see whose creature is tougher. Battle me!',
  ]);
  var result = await CC.fight({
    canLose: true,
    trainer: {
      name: 'Juniper', look: 'juniper', coins: 100,
      winText: 'What?! I had the type advantage! Next time, I\'m winning.',
      loseText: 'Ha! Told you. Type advantage, baby!',
      team: [CC.mon.make(rival, 5)],
    },
  });
  F().juniper1 = result === 'win' ? 'won' : 'lost';
  CC.healParty();
  await CC.say(result === 'win' ? 'Ha ha! What a match. Let me patch up your creatures.' : 'Don\'t be glum. Losing teaches you things. Let me patch you both up.', { who: 'Elder Willow' });
  CC.sfx('heal');
  await CC.say('I\'ll be ahead of you the whole way! See you out there!', { who: 'Juniper' });
  CC.state.bag.cube += 5; CC.state.bag.potion += 3;
  CC.sfx('buy');
  await CC.say('Elder Willow gave you 5 Basic Cubes and 3 Potions!');
  await CC.talk('Elder Willow', [
    'Cubes catch wild creatures. Weaken one first, and catching gets much easier.',
    'Head north through the Meadow Path to the Grassland. Farmer Bramble keeps the trail to the Forest. Show him what you can do!',
  ]);
}

function starterSelect() {
  return new Promise(function (resolve) {
    var sel = 0, busy = false;
    var scr = {
      opaque: true,
      update: function () {
        if (busy) return;
        if (CC.input.pressed.left) { sel = (sel + 2) % 3; CC.sfx('blip'); }
        if (CC.input.pressed.right) { sel = (sel + 1) % 3; CC.sfx('blip'); }
        if (CC.input.pressed.a) {
          CC.sfx('select'); busy = true;
          var id = STARTERS[sel];
          CC.yesNo('Choose ' + CC.CREATURES[id].name + ', ' + STARTER_BLURB[id] + '? (' + CC.CREATURES[id].types[0] + ' type)').then(function (yes) {
            busy = false;
            if (yes) { CC.pop(scr); resolve(id); }
          });
        }
      },
      draw: function () {
        var g = CC.g;
        CC.rect(0, 0, 240, 160, '#5a3a2a');
        for (var y = 0; y < 160; y += 12) CC.rect(0, y, 240, 1, '#4a2e22');
        // the table
        g.fillStyle = '#3a2418'; g.beginPath(); g.ellipse(120, 92, 112, 34, 0, 0, Math.PI * 2); g.fill();
        g.fillStyle = '#4f8a3a'; g.beginPath(); g.ellipse(120, 88, 108, 30, 0, 0, Math.PI * 2); g.fill();

  Shadow: ['#b48ad8', '#6e46a0', '#3a2260'],
  Lumen: ['#fff8d8', '#f0dc8a', '#b8a050'],
};

// Each elemental type hits exactly two others for 2x.
CC.TYPE_HITS = {
  Fire: ['Plant', 'Frost'],
  Water: ['Fire', 'Earth'],
  Plant: ['Water', 'Earth'],
  Earth: ['Bolt', 'Lumen'],
  Bolt: ['Water', 'Frost'],
  Frost: ['Plant', 'Shadow'],
  Shadow: ['Lumen', 'Bolt'],
  Lumen: ['Shadow', 'Fire'],
};

// One attacking type against one defending type.
CC.typeVs = function (atk, def) {
  if (atk === 'Normal' || def === 'Normal' || !atk) return 1;
  if (CC.TYPE_HITS[atk].includes(def)) return 2;
  // Shadow and Lumen hit each other for 2x; otherwise the reverse of a 2x is 0.5x
  if (CC.TYPE_HITS[def].includes(atk)) return 0.5;
  // darkness can't swallow darkness, light can't blind light
  if (atk === def && (atk === 'Shadow' || atk === 'Lumen')) return 0.5;
  return 1;
};

CC.typeMult = function (atk, defTypes) {
  return defTypes.reduce(function (m, t) { return m * CC.typeVs(atk, t); }, 1);
};

// Stat budget (base total). docs/creature-catch-decisions-2.md section 10.
function budget(kind, r, id) {
  if (kind === 'starter1') return 210;
  if (kind === 'starter2') return 330;
  if (kind === 'starter3') return 450;
  var base = id === 'fangling' || id === 'rosferatu' ? 250 : 170 + 10 * r;
  if (kind === 'base') return base;
  if (kind === 'final') return Math.round(base * 1.6);
  return 195 + 16 * r + (id === 'moonlynx' ? 20 : 0); // Solo
}

var BUFF = { bal: 'rally', atk: 'rally', fast: 'quickstep', glass: 'quickstep', tank: 'guardup', wall: 'guardup', bulk: 'guardup' };
var BUFF2 = { bal: 'guardup', atk: 'quickstep', fast: 'rally', glass: 'rally', tank: 'rally', wall: 'rally', bulk: 'rally' };

// Level-up moves: [level, move id]
function learnset(types, profile, sig, kind) {
  var t1 = types[0], t2 = types[1], m1 = CC.TYPE_MOVES[t1], out;
  if (t1 === 'Normal') {
    out = [[1, 'tackle'], [1, 'growl'], [4, BUFF[profile]], [9, sig], [14, BUFF2[profile]], [20, 'bodyslam'], [28, 'guardup']];
  } else {
    // starters open with Tackle and Growl, so the first rival fight (Lv 5) isn't decided by type
    var starter = kind.indexOf('starter') === 0;
    out = [[1, 'tackle'], starter ? [1, 'growl'] : [1, m1[0]], [4, BUFF[profile]], starter ? [6, m1[0]] : null, [8, m1[2]],
      [12, t2 ? CC.TYPE_MOVES[t2][0] : starter ? 'bodyslam' : 'growl'], [starter ? 11 : 16, sig], [20, m1[1]],
      [26, t2 ? CC.TYPE_MOVES[t2][1] : 'bodyslam'], [34, BUFF2[profile]]].filter(Boolean);
  }
  var seen = {};
  return out.filter(function (e) { if (seen[e[1]]) return false; seen[e[1]] = 1; return true; })
    .sort(function (a, b) { return a[0] - b[0]; });
}

CC.CREATURES = {};
CC.CREATURE_ORDER = [];
ROWS.forEach(function (row) {
  var id = row[0], kind = row[4], total = budget(kind, row[3], id), w = CC.PROFILES[row[5]];
  var stats = w.map(function (x) { return Math.round(total / 4 * x); });
  CC.CREATURES[id] = {
    id: id, name: row[1], types: row[2], region: row[3], kind: kind, profile: row[5], sig: row[6],
    evo: row[7] ? { into: row[7][0], at: row[7][1] } : null,
    look: { body: row[8][0], main: row[8][1], accent: row[8][2] },
    base: { hp: stats[0], atk: stats[1], def: stats[2], spd: stats[3] }, total: total,
    learn: learnset(row[2], row[5], row[6], kind),
    xpYield: Math.round(total / 4),
  };
  CC.CREATURE_ORDER.push(id);
});
// evolved forms point back at what they came from
CC.CREATURE_ORDER.forEach(function (id) {
  var c = CC.CREATURES[id];
  if (c.evo) CC.CREATURES[c.evo.into].from = id;
});

// Catch rarity of each wild creature (Moonlynx spawns as Rare but catches as Very Rare)
CC.RARITY = {};
Object.keys(CC.SPAWNS).forEach(function (k) {
  ['common', 'uncommon', 'rare'].forEach(function (tier) {
    CC.SPAWNS[k][tier].forEach(function (id) { CC.RARITY[id] = tier; });
  });
});
