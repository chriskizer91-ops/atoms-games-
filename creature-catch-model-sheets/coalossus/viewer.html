<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coalossus Model Bay</title>
<style>
  :root { --bg: #17120f; --panel: rgba(30, 24, 20, 0.86); --ink: #f3e9df; --muted: #b9a999; --accent: #ff8a2a; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px calc(12px + env(safe-area-inset-bottom));
    display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; background: linear-gradient(transparent, rgba(0,0,0,0.55)); }
  button { appearance: none; border: 1px solid rgba(255,255,255,0.18); background: var(--panel); color: var(--ink);
    padding: 9px 12px; border-radius: 999px; font: inherit; cursor: pointer; }
  button[aria-pressed="true"] { background: var(--accent); color: #1b0f05; border-color: var(--accent); font-weight: 600; }
  .labels { position: fixed; inset: 0; pointer-events: none; text-align: center; }
  .labels div { position: absolute; transform: translate(-50%, -100%); background: var(--panel); padding: 6px 10px;
    border-radius: 10px; white-space: nowrap; }
  .labels b { display: block; font-size: 13px; }
  .labels span { color: var(--muted); font-size: 12px; }
  .msg { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); pointer-events: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div class="labels" id="labels"></div>
<div class="msg" id="msg">Loading Coalossus…</div>
<div class="bar" id="bar">
  <button data-mode="both" aria-pressed="true">Big + small</button>
  <button data-mode="big">Big</button>
  <button data-mode="small">Small</button>
  <button data-paint="1" aria-pressed="true">Paint</button>
</div>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";

const params = new URLSearchParams(location.search);
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x17120f);
const camera = new THREE.PerspectiveCamera(35, 1, 0.05, 100);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.target.set(0, 0.85, 0);
scene.add(new THREE.HemisphereLight(0xfff1e0, 0x3a2a20, 1.4));
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(-3, 5, 4); scene.add(key);
const rim = new THREE.DirectionalLight(0xffb070, 1.2); rim.position.set(3, 3, -4); scene.add(rim);
const floor = new THREE.Mesh(new THREE.CircleGeometry(6, 64), new THREE.MeshStandardMaterial({ color: 0x241b16, roughness: 1 }));
floor.rotation.x = -Math.PI / 2; scene.add(floor);

const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
const clay = new THREE.MeshStandardMaterial({ color: 0xb8b3ad, roughness: 0.8 });
const models = {};
const info = { big: "Big model", small: "Small model" };

function load(name, url) {
  return new Promise((ok, fail) => loader.load(url, g => {
    const root = g.scene; let tris = 0;
    root.traverse(o => { if (o.isMesh) { o.userData.paint = o.material; tris += o.geometry.index ? o.geometry.index.count / 3 : o.geometry.attributes.position.count / 3; } });
    models[name] = { root, tris }; scene.add(root); ok();
  }, undefined, fail));
}

let mode = params.get("mode") || "both", paint = params.get("paint") !== "0";
const labels = {};
function layout() {
  const both = mode === "both";
  const portrait = innerHeight > innerWidth;
  const stacked = both && portrait;  // phones: big on top, small below
  floor.visible = !stacked;
  for (const [n, m] of Object.entries(models)) {
    m.root.visible = both || mode === n;
    m.root.position.set(stacked ? 0 : both ? (n === "big" ? -1.25 : 1.25) : 0, stacked ? (n === "big" ? 1.3 : -1.3) : 0, 0);
    m.root.rotation.y = stacked ? -0.38 : -0.55;
    m.root.traverse(o => { if (o.isMesh) o.material = paint ? o.userData.paint : clay; });
  }
  const lab = document.getElementById("labels"); lab.innerHTML = "";
  for (const n of ["big", "small"]) {
    labels[n] = null;
    if (!models[n] || !(both || mode === n)) continue;
    const d = document.createElement("div");
    d.innerHTML = `<b>${info[n]}</b><span>${models[n].tris.toLocaleString()} triangles</span>`;
    lab.appendChild(d); labels[n] = d;
  }
  if (stacked) { camera.position.set(0, 1.75, 9.6); controls.target.set(0, 0.75, 0); }
  else { const dist = both ? (portrait ? 9.5 : 7.4) : (portrait ? 6.6 : 4.6); camera.position.set(0, 1.9, dist); controls.target.set(0, 0.8, 0); }
  controls.update();
  document.querySelectorAll("[data-mode]").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === mode));
  document.querySelector("[data-paint]").setAttribute("aria-pressed", paint);
}
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener("resize", () => { resize(); layout(); });
document.getElementById("bar").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.mode) mode = b.dataset.mode; else paint = !paint;
  layout();
});
resize();
Promise.all([load("big", "models/coalossus_full.glb"), load("small", "models/coalossus_small.glb")]).then(() => {
  document.getElementById("msg").remove(); layout();
  const v = new THREE.Vector3();
  renderer.setAnimationLoop(() => {
    controls.update(); renderer.render(scene, camera);
    for (const [n, d] of Object.entries(labels)) {
      if (!d) continue;
      v.copy(models[n].root.position).add(new THREE.Vector3(0, 2.05, 0)).project(camera);
      d.style.left = `${(v.x * 0.5 + 0.5) * innerWidth}px`;
      d.style.top = `${Math.max(64, (-v.y * 0.5 + 0.5) * innerHeight)}px`;
    }
  });
  window.modelsReady = true;
}).catch(err => { document.getElementById("msg").textContent = "Could not load the models: " + err.message; });
</script>
</body>
</html>
