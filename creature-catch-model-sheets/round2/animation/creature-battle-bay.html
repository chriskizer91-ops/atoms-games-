<title>Creature Battle Bay</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=JetBrains+Mono:wght@400;500&family=Pixelify+Sans:wght@500&display=swap">
<style>
  /* Layout: full-screen 3D stage; name plate top-left; battle text box, the creature's moves (from the
     game data) and the creature picker along the bottom, like the battle screen in the game. */
  :root {
    --bg: #15100d; --panel: #221a15; --ink: #f4ebe2; --muted: #b6a596; --line: #3a2d24;
    --lava: #ff8a2a; --lava-ink: #1d1006;
    --box: #f6efe2; --box-ink: #2a1c14; --box-edge: #a8784a;
    --font-name: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    --font-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-data: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    --font-game: "Pixelify Sans", "Courier New", monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font-body); overflow: hidden; }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; background: var(--ink); }
  .plate { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px));
    right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 3px; pointer-events: none; }
  .plate h1 { margin: 0; font: 600 22px/1.1 var(--font-name); }
  .plate p { margin: 0; font: 400 11px/1.4 var(--font-data); color: var(--muted); letter-spacing: 0.04em; }
  .chip { display: inline-block; padding: 1px 7px; border-radius: 999px; font: 500 11px/1.5 var(--font-name); color: #1b120c; margin-right: 4px; }
  .dock { position: fixed; left: 0; right: 0; bottom: 0; display: grid; gap: 7px;
    padding-block: 8px calc(10px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .say { justify-self: center; width: min(560px, 100%); box-sizing: border-box; background: var(--box); color: var(--box-ink);
    border: 3px solid var(--box-ink); border-radius: 8px; box-shadow: inset 0 0 0 2px var(--box), inset 0 0 0 4px var(--box-edge);
    padding: 8px 12px; font: 500 16px/1.25 var(--font-game); min-height: 1.25em; transition: opacity 0.25s; }
  .say.off { opacity: 0; }
  .strip { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-inline: 12px; justify-content: safe center;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 14px, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(90deg, transparent, #000 14px, #000 calc(100% - 28px), transparent); }
  .strip::-webkit-scrollbar { display: none; }
  button { appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: 500 14px/1 var(--font-name);
    padding: 8px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap; flex: none; }
  button[aria-pressed="true"] { background: var(--lava); color: var(--lava-ink); border-color: var(--lava); }
  button:focus-visible { outline: 2px solid var(--lava); outline-offset: 2px; }
  button:disabled { opacity: 0.45; cursor: default; }
  .move { border-left: 4px solid var(--tc, var(--muted)); border-radius: 10px; padding: 8px 11px 8px 9px; }
  .react { --tc: var(--muted); }
  .loading { position: fixed; inset: 0; display: grid; place-content: center; gap: 10px; text-align: center; padding-inline: 16px; }
  .loading p { margin: 0; color: var(--muted); font: 400 13px/1.4 var(--font-body); }
  .loading .track { width: min(260px, 70vw); height: 4px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .loading .fill { height: 100%; width: 0%; background: var(--lava); transition: width 0.2s; }
  .loading .mb { font: 400 11px/1 var(--font-data); color: var(--muted); font-variant-numeric: tabular-nums; }
  @media (prefers-reduced-motion: reduce) { .loading .fill, .say { transition: none; } }
</style>

<canvas id="stage" aria-label="Creature models playing their battle moves. Drag to turn, pinch or scroll to zoom."></canvas>
<div id="flash"></div>
<div class="plate">
  <h1 id="title">Creature Battle Bay</h1>
  <p id="types"></p>
  <p id="facts"></p>
</div>
<div class="loading" id="loading">
  <p>Loading the creatures</p>
  <div class="track"><div class="fill" id="fill"></div></div>
  <span class="mb" id="mb">0.0 MB</span>
</div>
<div class="dock" id="dock" hidden>
  <div class="say off" id="say" aria-live="polite">&nbsp;</div>
  <div class="strip" id="moves" role="group" aria-label="Moves"></div>
  <div class="strip" id="pick" role="group" aria-label="Creature"></div>
</div>

} }
</script>

function stream(c, type, from, dur) {

  during(0, dur, () => { const p = at(c, from), d = target(c).sub(p).normalize(); for (let i = 0; i < 6; i++) emit(type, p, d.clone().multiplyScalar(rand(3.5, 5.5) * s).add(randDir().multiplyScalar(0.5 * s)), s); });
  if (type === "Earth") after(dur * 0.4, () => { const p = at(c, from); for (let i = 0; i < 6; i++) throwRock(p, target(c).sub(p).normalize().multiplyScalar(rand(3.5, 4.5) * s).add(new THREE.Vector3(0, rand(2, 3) * s, 0)), ground(c), 0.06 * s); });
}
function charge(c, type, dur) { const s = Math.max(c.k, 0.45); during(0, dur, () => { const ch = at(c, "chest"); for (let i = 0; i < 4; i++) { const p = ch.clone().add(randDir().multiplyScalar(1.5 * s)); emit(type, p, ch.clone().sub(p).divideScalar(0.45), s, 0.45); } }); }
function glowTo(c, to, dur) { const from = 1; during(0, dur, k => c.mat.emissiveIntensity = from + (to - from) * k); after(dur, () => during(0, 0.8, k => c.mat.emissiveIntensity = to + (1 - to) * k)); }
function tintPulse(c, color, dur, fn) { const col = new THREE.Color(color); during(0, dur, k => c.tint.value.set(col.r, col.g, col.b, fn(k))); after(dur, () => c.tint.value.w = 0); }
function statFx(c, up, where) {
  const s = Math.max(c.k, 0.45), base = where || c.root.position;
  for (let i = 0; i < 12; i++) after(i * 0.05, () => { const a = rand(0, Math.PI * 2), r = rand(0.5, 0.8) * Math.max(c.size.x, c.size.z) * 0.6; arrow(new THREE.Vector3(base.x + Math.cos(a) * r, base.y + rand(0.05, 0.5) * c.size.y, base.z + Math.sin(a) * r), up ? pick(["#ff8a3a", "#ffc070"]) : pick(["#5a8ae0", "#9ac0ff"]), !up, 0.07 * s); });
  if (!where) tintPulse(c, up ? "#ff9a4a" : "#5a8ae0", 0.7, k => 0.15 + Math.abs(Math.sin(k * Math.PI * 3)) * 0.35);
}
function swirl(c, type, center, dur) { const s = Math.max(c.k, 0.45); during(0, dur, k => { for (let i = 0; i < 3; i++) { const a = now * 9 + i * 2.1; emit(type, center.clone().add(new THREE.Vector3(Math.cos(a) * 0.6 * s * (1 - k * 0.5), rand(0, 0.6) * s, Math.sin(a) * 0.6 * s * (1 - k * 0.5))), new THREE.Vector3(0, 0.8 * s, 0), s * 0.8, 0.45); } }); }
function shockwave(c, type) {
  const s = Math.max(c.k, 0.45), f = c.root.localToWorld(new THREE.Vector3(0, 0.03, c.size.z * 0.35)); f.y = ground(c) + 0.03;
  ring(f, TYPES[type]?.c[0] || "#fff", 0.2 * s, 3.4 * s, 0.7); after(0.12, () => ring(f, TYPES[type]?.ui || "#fff", 0.2 * s, 2.4 * s, 0.6));
  for (let i = 0; i < 36; i++) { const d = new THREE.Vector3(rand(-1, 1), 0, rand(-1, 1)).normalize(); smoke.spawn({ pos: f.clone().addScaledVector(d, 0.3 * s), vel: d.multiplyScalar(rand(1.5, 3) * s).setY(rand(0.2, 0.7) * s), life: rand(0.8, 1.3), size: 0.25 * s, size1: 0.8 * s, color: pick(["#8a6a4a", "#a8845e", "#5e4532"]), alpha: 0.55, drag: 1.6 }); }
  if (type === "Earth") for (let i = 0; i < 10; i++) { const d = new THREE.Vector3(rand(-1, 1), 0, rand(-1, 1)).normalize(); throwRock(f.clone().addScaledVector(d, rand(0.3, 1.2) * s), new THREE.Vector3(d.x, rand(2.5, 4.5), d.z).multiplyScalar(s), ground(c), 0.07 * s); }
}
function hitFlash(c) { for (let i = 0; i < 3; i++) { after(i * 0.1, () => c.tint.value.set(1, 1, 1, 0.85)); after(i * 0.1 + 0.05, () => c.tint.value.w = 0); } const p = at(c, "chest"), s = Math.max(c.k, 0.45); burst("Normal", p, 16, 2.4 * s, s); glow.spawn({ pos: p, life: 0.2, size: 0.9 * s, size1: 0.1, color: "#ffffff" }); }
function dissolve(c, dur) {
  const s = Math.max(c.k, 0.45), cols = (c.types || ["Normal"]).flatMap(t => TYPES[t].c).concat(["#ffffff"]);
  c.mat.transparent = true;
  during(0, dur, k => { c.mat.opacity = 1 - k; for (let i = 0; i < 6; i++) glow.spawn({ pos: c.root.localToWorld(new THREE.Vector3(rand(-0.4, 0.4) * c.size.x, rand(0.1, 0.7) * c.size.y * (1 - k * 0.6), rand(-0.4, 0.4) * c.size.z)), vel: new THREE.Vector3(rand(-0.2, 0.2), rand(0.6, 1.3), rand(-0.2, 0.2)).multiplyScalar(s), life: 0.8, size: rand(0.05, 0.1) * s, size1: 0, color: pick(cols) }); });
  after(dur, () => { c.root.visible = false; c.mat.opacity = 1; c.mat.transparent = false; });
}
function sendOutFx(c) { const s = Math.max(c.k, 0.45), p = c.root.localToWorld(new THREE.Vector3(0, c.size.y * 0.35, 0)); glow.spawn({ pos: p, life: 0.3, size: 2.2 * s, size1: 0.2, color: "#ffffff" }); burst("Normal", p, 40, 3 * s, s); const f = c.root.position.clone(); f.y += 0.03; ring(f, "#ffffff", 0.2 * s, 2.0 * s, 0.5); }

// what each kind of move does, following the 2D game's moveAnim (timings match the shared clips)
function moveFx(c, mv) {
  const T = mv.type, col = TYPES[T]?.ui || "#fff";
  if (c.id === "coalossus" && mv.id === "coalswipe") { // Coalossus's own signature clip
    during(0.3, 0.5, () => { const p = at(c, "paw_fl_R"); for (let i = 0; i < 10; i++) emit("Fire", p.clone().add(randDir().multiplyScalar(0.06)), randDir().multiplyScalar(0.3).setY(0.4), 1.4, 0.4); });
    after(0.6, () => { impact(c, "Fire", true); shake(0.04, 0.25); screenFlash(col, 0.25); }); return;
  }
  switch (mv.cat) {
    case "physical": after(0.45, () => { impact(c, T, false); shake(0.03 * Math.max(c.k, 0.5), 0.2); }); if (T === "Earth") stream(c, T, "paw_fl_R", 0.1); break;
    case "special": after(0.3, () => stream(c, T, "mouth", 0.38)); after(0.8, () => impact(c, T, false)); break;
    case "strong_physical": charge(c, T, 0.6); after(1.0, () => { shockwave(c, T); shake(0.09 * Math.max(c.k, 0.5), 0.5); screenFlash(col, 0.3); }); after(1.25, () => impact(c, T, true)); break;
    case "strong_special": charge(c, T, 0.75); glowTo(c, 3, 0.75); tintPulse(c, col, 0.75, k => 0.22 * k);
      after(0.92, () => { const p = at(c, "mouth"), d = fwd(c), s = Math.max(c.k, 0.45); for (let i = 0; i < 150; i++) emit(T, p, d.clone().multiplyScalar(rand(3, 7) * s).add(randDir().multiplyScalar(rand(0.5, 2) * s)), s * 1.5, rand(0.5, 0.9)); screenFlash(col, 0.5); shake(0.06 * Math.max(c.k, 0.5), 0.4); });
      after(1.2, () => impact(c, T, true)); break;
    case "boost": case "boost_guard": after(0.3, () => { statFx(c, true); swirl(c, T, c.root.position.clone(), 0.6); }); break;
    case "status": during(0.2, 0.8, () => { const p = at(c, "mouth"), d = target(c).sub(p).normalize(), s = Math.max(c.k, 0.45); emit(T, p, d.multiplyScalar(rand(2, 3) * s).add(randDir().multiplyScalar(0.4 * s)), s, 0.9); });
      after(0.9, () => { const t = target(c); swirl(c, T, t, 0.5); statFx(c, false, t); }); break;
  }
}

// ---------------- battle text, moves and picker
const sayEl = document.getElementById("say"); let sayTimer = 0;
function say(text) { sayEl.classList.remove("off"); let i = 0; clearInterval(sayEl._t); sayEl._t = setInterval(() => { i++; sayEl.textContent = text.slice(0, i); if (i >= text.length) clearInterval(sayEl._t); }, 22); sayTimer = 2.4; }
let current = "mushling", busy = false;
const REACT = [{ id: "hit", name: "Take a hit", react: true }, { id: "faint", name: "Faint", react: true }, { id: "send_out", name: "Send out", react: true }];
function run(mv) {
  const c = creatures[current]; if (busy || !c) return;
  busy = true; setButtons();
  const done = () => { busy = false; setButtons(); };
  if (mv.react) {
    if (mv.id === "hit") { say(`${c.name} was hit!`); hitFlash(c); shake(0.04, 0.25); playClip(c, "hit", done); }
    else if (mv.id === "faint") { say(`${c.name} fainted!`); c.hold = true; after(0.6, () => dissolve(c, 1.1)); playClip(c, "faint", () => after(0.9, () => { c.hold = false; c.root.visible = true; sendOutFx(c); say(`Go! ${c.name}!`); playClip(c, "send_out", done); })); }
    else { say(`Go! ${c.name}!`); c.root.visible = true; sendOutFx(c); playClip(c, "send_out", done); }
    return;
  }
  say(`${c.name} used ${mv.name}!`); moveFx(c, mv); playClip(c, mv.clip, done);
}
function setButtons() { document.querySelectorAll("#moves button").forEach(b => { if (b.id !== "walk") b.disabled = busy; }); }
function buildMoves() {
  const c = creatures[current], el = document.getElementById("moves"); el.innerHTML = "";
  const w = document.createElement("button"); w.id = "walk"; w.textContent = "Walk"; w.setAttribute("aria-pressed", String(walking));
  w.onclick = () => { walking = !walking; w.setAttribute("aria-pressed", String(walking)); for (const x of Object.values(creatures)) if (!busy) baseLoop(x); }; el.appendChild(w);
  for (const mv of [...c.moves, ...REACT]) { const b = document.createElement("button"); b.className = "move" + (mv.react ? " react" : ""); b.textContent = mv.name; if (!mv.react) b.style.setProperty("--tc", TYPES[mv.type]?.ui || "#ccc"); b.title = mv.react ? mv.name : `${mv.type} · ${mv.cat.replace("_", " ")}`; b.onclick = () => run(mv); el.appendChild(b); }
}
function show(id) {
  current = id; const c = creatures[id];
  for (const x of Object.values(creatures)) x.root.visible = false;
  c.root.visible = true; c.root.position.set(0, 0, 0); c.root.rotation.y = -0.75; baseLoop(c);
  const r = Math.max(c.size.x, c.size.z); floor.scale.setScalar(r * 0.9);
  const vf = THREE.MathUtils.degToRad(camera.fov) / 2, hf = Math.atan(Math.tan(vf) * camera.aspect);
  const dist = Math.max((c.size.y * 1.1 / 2) / Math.tan(vf) / 0.55, (r * 0.62) / Math.tan(hf) / 0.95);
  controls.target.set(0, c.size.y * 0.45, 0); camera.position.set(0, c.size.y * 0.45 + dist * 0.22, dist); controls.minDistance = dist * 0.25; controls.maxDistance = dist * 2.5; controls.update();
  document.getElementById("title").textContent = c.name;
  document.getElementById("types").innerHTML = c.types.map(t => `<span class="chip" style="background:${TYPES[t].ui}">${t}</span>`).join("") + ` ${BODY[c.plan] || c.plan} body`;
  document.getElementById("facts").textContent = `Built by ${c.builder} · ${c.moves.length} moves from the game`;
  document.querySelectorAll("#pick button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.id === id)));
  buildMoves();
}
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); const s = renderer.domElement.height * 0.5 / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)); for (const p of [glow, smoke]) { p.u.uScale.value = s; p.u.uMax.value = renderer.domElement.height * 0.16; } }
addEventListener("resize", () => { resize(); if (creatures[current]) show(current); });
resize();
Promise.all(IDS.map(load)).then(() => {
  document.getElementById("loading").hidden = true; document.getElementById("dock").hidden = false;
  const pk = document.getElementById("pick");
  for (const id of IDS) { const b = document.createElement("button"); b.dataset.id = id; b.textContent = creatures[id].name; b.onclick = () => { if (!busy) show(id); }; pk.appendChild(b); }
  show(current);
  const clock = new THREE.Clock(), camBase = new THREE.Vector3(); let amb = 0;
  renderer.setAnimationLoop(() => {
    const dt = Math.min(clock.getDelta(), 0.05); now += dt;
    for (let i = timers.length - 1; i >= 0; i--) { const t = timers[i]; if (t.until !== undefined) { if (now >= t.at) t.fn(Math.min(1, (now - t.at) / (t.until - t.at))); if (now >= t.until) timers.splice(i, 1); } else if (now >= t.at) { timers.splice(i, 1); t.fn(); } }
    for (const c of Object.values(creatures)) if (c.root.visible) c.mixer.update(dt);
    amb -= dt; const c = creatures[current];
    if (amb <= 0 && c.root.visible) { amb = 0.18; c.root.updateMatrixWorld(true); const s = Math.max(c.k, 0.45);
      for (const a of c.ambient) { if (!c.anchors[a.anchor]) continue; const p = at(c, a.anchor);
        if (a.kind === "smoke") { smoke.spawn({ pos: p, vel: new THREE.Vector3(rand(-0.08, 0.08), rand(0.3, 0.5), rand(-0.08, 0.08)), life: rand(1.8, 2.6), size: 0.1, size1: 0.45, color: "#6b625c", alpha: 0.3 }); if (Math.random() < 0.25) emit("Fire", p, new THREE.Vector3(rand(-0.2, 0.2), rand(0.5, 1), rand(-0.2, 0.2)), 0.5, 0.8); }
        else if (a.kind === "spores" && Math.random() < 0.35) smoke.spawn({ pos: p.clone().add(randDir().multiplyScalar(0.15 * s)), vel: new THREE.Vector3(rand(-0.1, 0.1), rand(0.05, 0.15), rand(-0.1, 0.1)), life: 2.4, size: 0.035, size1: 0.02, color: pick(["#b48ad8", "#d8c4f0"]), alpha: 0.8 });
        else if (a.kind === "drip" && Math.random() < 0.12) glow.spawn({ pos: p, vel: new THREE.Vector3(0, -0.1, 0), life: 0.9, size: 0.05, size1: 0.04, color: "#8fd0ff", gravity: 3, floor: ground(c) + 0.01 });
        else if (a.kind === "sparkle" && Math.random() < 0.4) glow.spawn({ pos: p.clone().add(randDir().multiplyScalar(0.3 * s)), vel: new THREE.Vector3(0, 0.15, 0), life: 1.0, size: 0.09 * s, size1: 0, color: pick(TYPES.Lumen.c) }); } }
    glow.update(dt); smoke.update(dt); updateShapes(dt);
    if (flashA > 0) { flashEl.style.opacity = String(flashA); flashA = Math.max(0, flashA - dt * 4); if (flashA === 0) flashEl.style.opacity = "0"; }
    if (sayTimer > 0) { sayTimer -= dt; if (sayTimer <= 0) sayEl.classList.add("off"); }
    controls.update(); camBase.copy(camera.position);
    if (shakeT > 0) { shakeT -= dt; camera.position.x += rand(-shakeAmt, shakeAmt); camera.position.y += rand(-shakeAmt, shakeAmt) * 0.5; }
    renderer.render(scene, camera); camera.position.copy(camBase);
  });
  window.modelsReady = true;
  window.bay = { show, run: id => run([...creatures[current].moves, ...REACT].find(m => m.id === id)), get now() { return now; } };
}).catch(err => { document.querySelector("#loading p").textContent = "The creatures didn't load. Reload the page to try again. (" + err.message + ")"; });
</script>
