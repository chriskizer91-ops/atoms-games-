<title>Creature Battle Bay</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=JetBrains+Mono:wght@400;500&family=Pixelify+Sans:wght@500&display=swap">
<style>
  /* Layout: full-screen 3D stage; name plate top-left; battle text box, the creature's moves (from the
     game data) and the creature picker along the bottom, like the battle screen in the game. */
  :root {
    --bg: #15100d; --panel: #221a15; --ink: #f4ebe2; --muted: #b6a596; --line: #3a2d24;
    --lava: #ff8a2a; --lava-ink: #1d1006;
    --box: #f6efe2; --box-ink: #2a1c14; --box-edge: #a8784a;
    --font-name: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    --font-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-data: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    --font-game: "Pixelify Sans", "Courier New", monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font-body); overflow: hidden; }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; background: var(--ink); }
  .plate { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px));
    max-width: calc(100% - 150px); display: grid; gap: 3px; pointer-events: none;
    background: color-mix(in srgb, var(--bg) 78%, transparent); padding: 8px 12px; border-radius: 12px; }
  .stagebtn { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); }
  .plate h1 { margin: 0; font: 600 22px/1.1 var(--font-name); }
  .plate p { margin: 0; font: 400 11px/1.4 var(--font-data); color: var(--muted); letter-spacing: 0.04em; }
  .chip { display: inline-block; padding: 1px 7px; border-radius: 999px; font: 500 11px/1.5 var(--font-name); color: #1b120c; margin-right: 4px; }
  .dock { position: fixed; left: 0; right: 0; bottom: 0; display: grid; gap: 7px;
    padding-block: 8px calc(10px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .say { justify-self: center; width: min(560px, 100%); box-sizing: border-box; background: var(--box); color: var(--box-ink);
    border: 3px solid var(--box-ink); border-radius: 8px; box-shadow: inset 0 0 0 2px var(--box), inset 0 0 0 4px var(--box-edge);
    padding: 8px 12px; font: 500 16px/1.25 var(--font-game); min-height: 1.25em; transition: opacity 0.25s; }
  .say.off { opacity: 0; }
  .strip { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-inline: 12px; justify-content: safe center;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 14px, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(90deg, transparent, #000 14px, #000 calc(100% - 28px), transparent); }
  .strip::-webkit-scrollbar { display: none; }
  button { appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: 500 14px/1 var(--font-name);
    padding: 8px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap; flex: none; }
  button[aria-pressed="true"] { background: var(--lava); color: var(--lava-ink); border-color: var(--lava); }
  button:focus-visible { outline: 2px solid var(--lava); outline-offset: 2px; }
  button:disabled { opacity: 0.45; cursor: default; }
  .move { border-left: 4px solid var(--tc, var(--muted)); border-radius: 10px; padding: 8px 11px 8px 9px; }
  .react { --tc: var(--muted); }
  .loading { position: fixed; inset: 0; display: grid; place-content: center; gap: 10px; text-align: center; padding-inline: 16px; }
  .loading p { margin: 0; color: var(--muted); font: 400 13px/1.4 var(--font-body); }
  .loading .track { width: min(260px, 70vw); height: 4px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .loading .fill { height: 100%; width: 0%; background: var(--lava); transition: width 0.2s; }
  .loading .mb { font: 400 11px/1 var(--font-data); color: var(--muted); font-variant-numeric: tabular-nums; }
  @media (prefers-reduced-motion: reduce) { .loading .fill, .say { transition: none; } }
</style>

<canvas id="stage" aria-label="Creature models playing their battle moves. Drag to turn, pinch or scroll to zoom."></canvas>
<div id="flash"></div>
<div class="plate">
  <h1 id="title">Creature Battle Bay</h1>
  <p id="types"></p>
  <p id="facts"></p>
</div>
<button class="stagebtn" id="stageBtn" type="button" aria-pressed="true" title="Switch between the Meadow Path clearing and the plain studio">Meadow</button>
<div class="loading" id="loading">
  <p>Loading the creatures</p>
  <div class="track"><div class="fill" id="fill"></div></div>
  <span class="mb" id="mb">0.0 MB</span>
</div>
<div class="dock" id="dock" hidden>
  <div class="say off" id="say" aria-live="polite">&nbsp;</div>
  <div class="strip" id="moves" role="group" aria-label="Moves"></div>
  <div class="strip" id="pick" role="group" aria-label="Creature"></div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

// Chapter 1 creatures first; the first one loads before the page opens, the rest load behind it.
const IDS = ["player-a", "player-b", "mossback", "embroak", "drizzlon", "clovermouse", "puffmunk", "fleecling", "mushling", "lunarion", "coalossus"];
const TOTAL_MB = 1.9;  // the first one's files
// The game's type colours and effect kinds (10-data-types.js, 02-art.js)
const TYPES = {
  Normal: { kind: "star", c: ["#ffffff", "#fff4c0", "#d8d0c0"], ui: "#d8d0c0" },
  Fire: { kind: "flame", c: ["#ffb36b", "#f0602c", "#ffd27a", "#a8301c"], ui: "#f0602c" },
  Water: { kind: "drop", c: ["#3a8ee8", "#8fd0ff", "#ffffff"], ui: "#3a8ee8" },
  Plant: { kind: "leaf", c: ["#4fb04a", "#a8e88a", "#2a6e34"], ui: "#4fb04a" },
  Earth: { kind: "rock", c: ["#e0c08a", "#a8784a", "#6a4a2c"], ui: "#a8784a" },
  Bolt: { kind: "bolt", c: ["#fff07a", "#ffffff", "#f0c828"], ui: "#f0c828" },
  Frost: { kind: "flake", c: ["#e4faff", "#9adcf0", "#ffffff"], ui: "#9adcf0" },
  Shadow: { kind: "wisp", c: ["#b48ad8", "#6e46a0", "#3a2260"], ui: "#8e64c0" },
  Lumen: { kind: "star", c: ["#fff8d8", "#f0dc8a", "#ffffff"], ui: "#f0dc8a" },

const BODY = { quad: "four-legged", round: "round", biped: "two-legged", bird: "bird", bug: "bug", serpent: "serpent", ghost: "ghost", frog: "frog", fish: "fish", turtle: "turtle" };
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const css = getComputedStyle(document.documentElement);
const canvas = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.background = new THREE.Color(css.getPropertyValue("--bg").trim());
const camera = new THREE.PerspectiveCamera(35, 1, 0.02, 200);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
const hemi = new THREE.HemisphereLight(0xfff1e0, 0x3a2a20, 1.4); scene.add(hemi);
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(-3, 5, 4); scene.add(key);
const rim = new THREE.DirectionalLight(0xffb070, 1.0); rim.position.set(3, 3, -4); scene.add(rim);
const floor = new THREE.Mesh(new THREE.CircleGeometry(1, 64), new THREE.MeshStandardMaterial({ color: css.getPropertyValue("--panel").trim(), roughness: 1 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
key.castShadow = true; key.shadow.mapSize.set(1024, 1024); key.shadow.bias = -0.0004; key.shadow.normalBias = 0.02; scene.add(key.target);

// ---------------- the stage: a Meadow Path clearing, after Chapter 1's first route (the first 3D demo's
// clearing idea, painted to match the creatures): sky, painted grass with a worn dirt path, a battle pad,
// a ring of trees and bushes, tufts and patches of tall grass that sway, flowers, distant hills and clouds.
// Everything is made in code here; no outside images. Sizes are in metres.
const meadow = new THREE.Group(); scene.add(meadow);
const seeded = n => () => ((n = Math.imul(n ^ (n >>> 15), 1 | n) + 0x6d2b79f5 | 0, ((n ^ (n >>> 13)) >>> 0) / 4294967296));
const R = seeded(7);
const rr = (a, b) => a + (b - a) * R();
function canvasTex(w, h, draw, colour = true) {
  const cv = document.createElement("canvas"); cv.width = w; cv.height = h; draw(cv.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = colour ? THREE.SRGBColorSpace : THREE.NoColorSpace;

function dab(g, x, y, r, col, a) { const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, col); gr.addColorStop(1, col + "00"); g.globalAlpha = a; g.fillStyle = gr; g.fillRect(x - r, y - r, 2 * r, 2 * r); g.globalAlpha = 1; }
const GROUND = 90, pathZ = x => -3.2 + 1.1 * Math.sin(x * 0.13) + 0.5 * Math.sin(x * 0.31 + 1);
const groundTex = canvasTex(2048, 2048, (g, w, h) => {
  g.fillStyle = "#6eab48"; g.fillRect(0, 0, w, h);
  const greens = ["#5c9a3b", "#7dbb52", "#8bc65e", "#4e8a35", "#9ccf68", "#6aa444"];
  for (let i = 0; i < 4200; i++) dab(g, rr(0, w), rr(0, h), rr(8, 60), greens[i % greens.length], rr(0.12, 0.32));
  const px = x => (x / GROUND + 0.5) * w, pz = z => (z / GROUND + 0.5) * h;
  for (let x = -GROUND / 2; x < GROUND / 2; x += 0.12) {  // the worn dirt path of Meadow Path, behind the pad
    const z = pathZ(x), wdt = 0.75 + 0.15 * Math.sin(x * 0.7);
    for (let k = 0; k < 3; k++) dab(g, px(x + rr(-0.2, 0.2)), pz(z + rr(-wdt, wdt) * 0.8), rr(10, 22), ["#c8a26a", "#b98f58", "#d6b47c"][k], 0.5);
  }
  for (let x = -GROUND / 2; x < GROUND / 2; x += 0.3) for (const sgn of [-1, 1]) dab(g, px(x), pz(pathZ(x) + sgn * rr(0.75, 1.05)), rr(8, 18), greens[(R() * 6) | 0], 0.45);
});
const detailTex = canvasTex(512, 512, (g, w, h) => {  // blades of grass, tiled once per metre
  g.fillStyle = "#a0a0a0"; g.fillRect(0, 0, w, h); g.lineCap = "round";
  for (let i = 0; i < 2600; i++) {
    const x = rr(0, w), y = rr(0, h), l = rr(8, 22), a = rr(-0.5, 0.5), v = (rr(120, 205)) | 0;
    g.strokeStyle = `rgb(${v},${v},${v})`; g.globalAlpha = 0.55; g.lineWidth = rr(1.2, 2.6);
    for (const ox of [-w, 0, w]) for (const oy of [-h, 0, h]) { g.beginPath(); g.moveTo(x + ox, y + oy); g.lineTo(x + ox + Math.sin(a) * l, y + oy - Math.cos(a) * l); g.stroke(); }
  }
  g.globalAlpha = 1;
}, false);
detailTex.wrapS = detailTex.wrapT = THREE.RepeatWrapping;
const groundMat = new THREE.MeshStandardMaterial({ map: groundTex, roughness: 1 });
groundMat.onBeforeCompile = sh => {
  sh.uniforms.uDetail = { value: detailTex };
  sh.fragmentShader = "uniform sampler2D uDetail;\n" + sh.fragmentShader.replace("#include <map_fragment>",
    `#include <map_fragment>\n  float dtl = texture2D(uDetail, vMapUv * ${GROUND.toFixed(1)}).r * 1.6;\n  diffuseColor.rgb *= mix(1.0, dtl, 0.55);`);
};
const groundMesh = new THREE.Mesh(new THREE.PlaneGeometry(GROUND, GROUND), groundMat);
groundMesh.rotation.x = -Math.PI / 2; groundMesh.receiveShadow = true; meadow.add(groundMesh);
// the battle pad under the creature: lighter, worn grass with a soft rim, like the game's battle pads
const padTex = canvasTex(512, 512, (g, w, h) => {
  const c = w / 2, gr = g.createRadialGradient(c, c, 0, c, c, c);
  gr.addColorStop(0, "#a9d673ff"); gr.addColorStop(0.62, "#9acb66ff"); gr.addColorStop(0.8, "#7ea44cff"); gr.addColorStop(0.9, "#b39563c0"); gr.addColorStop(1, "#b3956300");
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 500; i++) { const a = rr(0, 6.283), d = Math.sqrt(R()) * c * 0.8; dab(g, c + Math.cos(a) * d, c + Math.sin(a) * d, rr(6, 18), ["#b8de86", "#8fc25c", "#c4b07a"][i % 3], 0.25); }
});
const pad = new THREE.Mesh(new THREE.CircleGeometry(1, 64), new THREE.MeshStandardMaterial({ map: padTex, transparent: true, depthWrite: false, roughness: 1, polygonOffset: true, polygonOffsetFactor: -2 }));
pad.rotation.x = -Math.PI / 2; pad.position.y = 0.003; pad.receiveShadow = true; pad.renderOrder = 1; meadow.add(pad);
// sky dome, clouds and far hills
const sky = new THREE.Mesh(new THREE.SphereGeometry(160, 32, 16), new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { uTop: { value: new THREE.Color("#4b94e0") }, uBot: { value: new THREE.Color("#d9eef8") } },
  vertexShader: "varying vec3 vD; void main() { vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }",
  fragmentShader: "uniform vec3 uTop; uniform vec3 uBot; varying vec3 vD; void main() { gl_FragColor = vec4(mix(uBot, uTop, smoothstep(0.0, 0.45, vD.y)), 1.0); }" }));
meadow.add(sky);
const cloudTex = canvasTex(256, 128, (g, w, h) => { for (let i = 0; i < 14; i++) dab(g, rr(50, 206), rr(55, 85) - (i % 3) * 8, rr(26, 46), "#ffffff", 0.55); });
for (let i = 0; i < 9; i++) {
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: cloudTex, fog: false, depthWrite: false, transparent: true, opacity: 0.9 }));
  const a = rr(0, 6.283), d = rr(95, 130); sp.position.set(Math.cos(a) * d, rr(22, 48), Math.sin(a) * d); sp.scale.set(rr(30, 48), rr(13, 18), 1); meadow.add(sp);
}
const hillMat = new THREE.MeshStandardMaterial({ color: "#6f9c55", roughness: 1 });
for (let i = 0; i < 14; i++) { const a = i / 14 * 6.283 + rr(-0.2, 0.2), d = rr(62, 85), h = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 12), hillMat); h.scale.set(rr(16, 28), rr(5, 11), rr(10, 16)); h.position.set(Math.cos(a) * d, -1.5, Math.sin(a) * d); h.rotation.y = -a; meadow.add(h); }
// trees and bushes: soft round canopies painted with leaf dabs
const leafTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = "#4f8f3a"; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 900; i++) { const x = rr(0, w), y = rr(0, h); for (const ox of [-w, 0, w]) for (const oy of [-h, 0, h]) dab(g, x + ox, y + oy, rr(5, 13), ["#3d7a2e", "#5fa443", "#77b955", "#2f6826", "#8cc865"][i % 5], 0.5); }
});
leafTex.wrapS = leafTex.wrapT = THREE.RepeatWrapping; leafTex.repeat.set(3, 2);
const leafMats = ["#ffffff", "#e4f0c8", "#cfe3b8", "#f2ffd9"].map(c => new THREE.MeshStandardMaterial({ map: leafTex, color: c, roughness: 0.95 }));
const trunkMat = new THREE.MeshStandardMaterial({ color: "#7a5434", roughness: 1 });
function blob(r, detail = 18) {  // a lumpy sphere
  const g = new THREE.SphereGeometry(r, detail + 6, detail), p = g.attributes.position, v = new THREE.Vector3();
  const f = [rr(1, 3), rr(1, 3), rr(1, 3)], ph = [rr(0, 6), rr(0, 6), rr(0, 6)];
  for (let i = 0; i < p.count; i++) { v.fromBufferAttribute(p, i).normalize(); const k = 1 + 0.07 * Math.sin(v.x * f[0] * 3 + ph[0]) + 0.06 * Math.sin(v.y * f[1] * 3 + ph[1]) + 0.05 * Math.sin(v.z * f[2] * 3 + ph[2]); p.setXYZ(i, v.x * r * k, v.y * r * k * 0.88, v.z * r * k); }
  g.computeVertexNormals(); return g;
}
function tree(x, z, s) {
  const t = new THREE.Group(), mat = leafMats[(R() * leafMats.length) | 0];
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.18 * s, 0.32 * s, 3.2 * s, 10), trunkMat); trunk.position.y = 1.6 * s; t.add(trunk);
  const n = 4 + ((R() * 3) | 0);
  for (let i = 0; i < n; i++) { const m = new THREE.Mesh(blob(rr(1.3, 2.1) * s), mat), a = i / n * 6.283 + rr(0, 1); m.position.set(Math.cos(a) * rr(0.6, 1.3) * s, rr(3.6, 5.0) * s, Math.sin(a) * rr(0.6, 1.3) * s); m.rotation.y = rr(0, 6.28); t.add(m); }
  const top = new THREE.Mesh(blob(rr(1.5, 2.0) * s), mat); top.position.y = rr(5.2, 6.0) * s; t.add(top);
  t.position.set(x, 0, z); meadow.add(t);
}
for (let i = 0; i < 34; i++) { const a = rr(0, 6.283), d = rr(15, 32); tree(Math.cos(a) * d, Math.sin(a) * d - 4, rr(0.8, 1.35)); }
const bushMats = leafMats.map(m => { const b = m.clone(); b.map = leafTex.clone(); b.map.repeat.set(6, 4); b.map.needsUpdate = true; return b; });
for (let i = 0; i < 18; i++) { const a = rr(0, 6.283), d = rr(10, 16), b = new THREE.Mesh(blob(rr(0.45, 0.85)), bushMats[i % 4]); b.position.set(Math.cos(a) * d, 0.2, Math.sin(a) * d - 3); meadow.add(b); }
// grass tufts and two patches of tall grass (where wild creatures hide), swaying in the wind
const bladeTex = canvasTex(256, 256, (g, w, h) => {
  for (let i = 0; i < 70; i++) {
    const x = rr(20, w - 20), l = rr(0.45, 1) * h, bend = rr(-40, 40), wd = rr(5, 10);
    g.fillStyle = ["#62a03f", "#7cba52", "#90c95f", "#558f37", "#a2d470"][i % 5];
    g.beginPath(); g.moveTo(x - wd, h); g.quadraticCurveTo(x + bend * 0.3, h - l * 0.5, x + bend, h - l); g.quadraticCurveTo(x + bend * 0.3 + wd * 0.4, h - l * 0.5, x + wd, h); g.fill();
  }
});
const tuftGeo = (() => { const parts = []; for (let k = 0; k < 3; k++) { const g = new THREE.PlaneGeometry(1, 1); g.translate(0, 0.5, 0); g.rotateY(k * Math.PI / 3); parts.push(g); } const pos = [], uv = [], idx = []; let o = 0; for (const g of parts) { pos.push(...g.attributes.position.array); uv.push(...g.attributes.uv.array); idx.push(...Array.from(g.index.array, i => i + o)); o += g.attributes.position.count; } const out = new THREE.BufferGeometry(); out.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3)); out.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2)); out.setIndex(idx); out.computeVertexNormals(); return out; })();
const wind = { value: 0 };
const tuftMat = new THREE.MeshStandardMaterial({ map: bladeTex, alphaTest: 0.5, side: THREE.DoubleSide, roughness: 1 });
tuftMat.onBeforeCompile = sh => { sh.uniforms.uWind = wind; sh.vertexShader = "uniform float uWind;\n" + sh.vertexShader.replace("#include <begin_vertex>", "#include <begin_vertex>\n  float hh = position.y * position.y; vec4 ip = instanceMatrix[3];\n  transformed.x += sin(uWind * 1.7 + ip.x * 0.6 + ip.z * 0.4) * 0.12 * hh;\n  transformed.z += cos(uWind * 1.3 + ip.x * 0.3) * 0.06 * hh;");
  sh.fragmentShader = sh.fragmentShader.replace("#include <normal_fragment_begin>", "#include <normal_fragment_begin>\n  normal = normalize(vNormal);"); };  // both sides lit like the ground
// tufts lean to the light a little: normals point up so they shade like the ground
tuftGeo.attributes.normal.array.forEach((_, i, a) => { if (i % 3 === 1) a[i] = 1; else a[i] = 0; });
const tuftSpots = [];
for (let i = 0; i < 2600; i++) { const a = rr(0, 6.283), d = 0.5 + Math.sqrt(R()) * 34; const x = Math.cos(a) * d, z = Math.sin(a) * d; if (Math.abs(z - pathZ(x)) < 0.9) continue; tuftSpots.push([x, z, rr(0.16, 0.42), rr(0, 6.28)]); }
for (const [cx, cz] of [[-6.5, -6.5], [7.5, -7.5]]) for (let i = 0; i < 520; i++) { const a = rr(0, 6.283), d = Math.sqrt(R()) * 3.2; tuftSpots.push([cx + Math.cos(a) * d * 1.3, cz + Math.sin(a) * d, rr(0.6, 0.95), rr(0, 6.28)]); }

function placeTufts(clearR) {
